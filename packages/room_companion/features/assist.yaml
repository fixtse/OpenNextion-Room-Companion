# Home Assistant Assist satellite. Start it from a "[Local] Assist" control in
# the carousel, the BOOT button, the Talk button entity, or the optional wake
# word (examples/room-companion/wake-word.yaml). A full-screen overlay, laid
# out like Home Assistant's voice dialog, shows the microphone (tap to talk
# again or stop), the status, what was heard and the reply as bubbles, and
# mute / Stop buttons. A swipe from the left edge also closes it (panel_back).
# It takes the screen from the dashboard stream.
#
# Voice timers set on this panel ("set a 10 minute pasta timer") are tracked by
# the voice assistant. A timer screen opens when one starts (closing itself
# after a few seconds) and when one finishes, sounding until Stop is tapped
# or five minutes pass. Pause/Resume sends an English timer command to HA
# conversation.process; HA remains the timer authority and returns its updated
# timer state over the API. HA helpers also offer Cancel / +1 min.
globals:
  - id: assist_mic_percent
    type: int
    initial_value: '100'
  - id: assist_compact
    type: bool
    initial_value: 'false'
  - id: assist_ready
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    id: microphone_muted
    name: Microphone muted
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - voice_assistant.stop:
    on_state:
      - script.execute: assist_sync_mute

button:
  - platform: template
    name: Talk
    icon: mdi:account-voice
    on_press:
      - script.execute: toggle_assist

# Which Dual MIC board microphone Assist hears: Auto picks the one with the
# better signal-to-noise ratio while running; Left/Right force one.
select:
  - platform: template
    id: assist_microphone_mode
    name: Assist microphone
    # Kept on the panel (Auto); not exposed to Home Assistant.
    internal: true
    icon: mdi:microphone-settings
    entity_category: config
    options: [Auto, Left, Right]
    initial_option: Auto
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(panel_microphone).set_mode(i);'

text_sensor:
  - platform: template
    id: assist_microphone_in_use
    name: Assist microphone in use
    disabled_by_default: true
    icon: mdi:microphone-question
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return std::string(id(panel_microphone).is_left() ? "Left" : "Right");'
    filters:
      # Only publish changes.
      - lambda: |-
          static std::string last;
          if (x == last) return {};
          last = x;
          return x;

binary_sensor:
  - id: !extend boot_btn
    on_click:
      max_length: 1s
      then:
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: toggle_assist

# Exposes the panel speaker and reply volume to Home Assistant.
media_player:
  - platform: speaker
    id: panel_media_player
    task_stack_in_psram: true
    name: Speaker
    volume_initial: 60%
    # Downloaded at build time (Home Assistant Voice PE, Apache-2.0).
    files:
      - id: timer_finished_sound
        file: "../../../assets/sounds/timer_finished.flac"  # From esphome/home-assistant-voice-pe (THIRD_PARTY_NOTICES.md).
    announcement_pipeline:
      speaker: panel_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    on_announcement:
      - script.stop: assist_finished
      - script.stop: assist_unmute_media_deferred
      - lvgl.label.update:
          id: assist_status
          text: Speaking...
    on_idle:
      - script.execute: assist_unmute_media_deferred
      - script.execute: assist_finished

voice_assistant:
  id: assist
  microphone:
    microphone: panel_microphone
    channels: 0
    gain_factor: 2
  media_player: panel_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - globals.set:
        id: assist_ready
        value: 'true'
  on_client_disconnected:
    - globals.set:
        id: assist_ready
        value: 'false'
    - script.stop: assist_unmute_media_deferred
    - lambda: 'onx_media::assist_muted.clear();'
    - voice_assistant.stop:
    - script.execute:
        id: assist_show
        status: Assist disconnected
    - script.execute: assist_finished
  on_listening:
    - script.stop: assist_finished
    - script.stop: assist_unmute_media_deferred
    - script.execute: assist_mute_media
    - script.execute:
        id: assist_show
        status: Listening...
    - script.execute:
        id: assist_pulse
        active: true
  on_stt_end:
    - script.execute:
        id: assist_pulse
        active: false
    - script.execute:
        id: assist_add_bubble
        text: !lambda 'return onx_notification::plain_text(x, 384);'
        user: true
    - lvgl.label.update:
        id: assist_status
        text: Thinking...
  on_tts_start:
    - script.execute:
        id: assist_add_bubble
        text: !lambda 'return onx_notification::plain_text(x, 512);'
        user: false
  on_idle:
    - script.execute:
        id: assist_pulse
        active: false
    - script.execute: assist_unmute_media_deferred
    - script.execute: assist_finished
  on_error:
    - script.execute:
        id: assist_pulse
        active: false
    - lvgl.label.update:
        id: assist_status
        text: !lambda 'return onx_notification::clipped(message, 128);'
    - script.execute: assist_unmute_media_deferred
    - script.execute: assist_finished
  # Local voice timers (also tells Home Assistant this satellite supports them).
  on_timer_started:
    - script.execute: timer_sync
    - lambda: |-
        onx_panel_detail::timers.focus = "local:" + timer.id;
        onx_panel_detail::timers.dismissed = false;
    - script.execute: timer_show
  on_timer_updated:
    - script.execute: timer_sync
    - lambda: |-
        auto &state = onx_panel_detail::timers;
        if (state.message_key == "local:" + timer.id) { state.message.clear(); state.command_pending = false; }
  on_timer_tick:
    - script.execute: timer_sync
  on_timer_cancelled:
    # ESPHome erases its timer after this callback; syncing get_timers() here
    # would reinsert the cancelled timer and might never get another tick.
    - lambda: |-
        onx_panel_detail::retire_local_timer(timer.id);
    - script.execute: timer_close_if_idle
  on_timer_finished:
    - script.stop: timer_snooze
    - lambda: |-
        auto &state = onx_panel_detail::timers;
        state.ringing = true;
        state.ringing_name = timer.name;
        state.ringing_total = timer.total_seconds;
        state.ringing_since = millis();
        state.focus.clear();
    - script.execute: timer_sync
    - lambda: |-
        onx_panel_detail::retire_local_timer(timer.id);
    - script.stop: timer_autoclose
    - script.execute: timer_show
    - script.execute: timer_ring

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // Live camera sound: Home Assistant converts the camera's audio
            // (go2rtc RTSP) with its ffmpeg proxy and plays it on this
            // panel's speaker as an announcement (the only pipeline here).
            id(room_panel)->set_camera_audio_actions(
                [](const std::string &speaker, const std::string &url) -> bool {
                  #ifdef USE_API_HOMEASSISTANT_SERVICES
                  if (!id(normal_ha_api_connected) || speaker.empty() || url.empty()) return false;
                  esphome::api::HomeassistantActionRequest call;
                  static constexpr char svc[] = "media_player.play_media";
                  static constexpr char k_entity[] = "entity_id";
                  static constexpr char k_id[] = "media_content_id";
                  static constexpr char k_type[] = "media_content_type";
                  static constexpr char v_type[] = "music";
                  static constexpr char k_announce[] = "announce";
                  static constexpr char v_true[] = "true";
                  call.service = {svc, sizeof(svc) - 1};
                  call.data.init(4);
                  auto add = [&](const char *k, size_t kl, const char *v, size_t vl) {
                    esphome::api::HomeassistantServiceMap item;
                    item.key = {k, kl};
                    item.value = {v, vl};
                    call.data.push_back(item);
                  };
                  const std::string prefix = esphome::room_companion::CAMERA_AUDIO_PREFIX;
                  if (url.rfind(prefix, 0) == 0) {
                    // Room Companion finds the camera's stream (room_companion.play_camera_audio).
                    static constexpr char rc_svc[] = "room_companion.play_camera_audio";
                    static constexpr char k_camera[] = "camera";
                    static constexpr char k_player[] = "media_player";
                    static constexpr char k_device[] = "device";
                    static constexpr char k_stream[] = "stream";
                    const std::string rest = url.substr(prefix.size());
                    const size_t eq = rest.find('=');
                    const std::string camera = rest.substr(0, eq), stream = eq == std::string::npos ? "" : rest.substr(eq + 1);
                    const std::string device = App.get_name();
                    call.service = {rc_svc, sizeof(rc_svc) - 1};  // call.data is still empty.
                    add(k_camera, sizeof(k_camera) - 1, camera.data(), camera.size());
                    add(k_player, sizeof(k_player) - 1, speaker.data(), speaker.size());
                    add(k_device, sizeof(k_device) - 1, device.data(), device.size());
                    if (!stream.empty()) add(k_stream, sizeof(k_stream) - 1, stream.data(), stream.size());
                    id(api_server)->send_homeassistant_action(call);
                    return true;
                  }
                  add(k_entity, sizeof(k_entity) - 1, speaker.data(), speaker.size());
                  add(k_id, sizeof(k_id) - 1, url.data(), url.size());
                  add(k_type, sizeof(k_type) - 1, v_type, sizeof(v_type) - 1);
                  add(k_announce, sizeof(k_announce) - 1, v_true, sizeof(v_true) - 1);
                  id(api_server)->send_homeassistant_action(call);
                  return true;
                  #else
                  return false;
                  #endif
                },
                []() {
                  id(panel_media_player).make_call()
                      .set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_STOP)
                      .set_announcement(true)
                      .perform();
                });
            // Pause/resume/stop a timer of this panel: only when its state allows it.
            auto local_command = [](const std::string &timer_id, onx_timer::Action action) {
              for (const auto &t : id(assist).get_timers()) {
                if (t.id != timer_id) continue;
                if (action != onx_timer::Action::STOP && (t.seconds_left == 0 ||
                    (action != onx_timer::Action::ADD_MINUTE && t.is_active != (action == onx_timer::Action::PAUSE)))) return;
                id(timer_command).execute("local:" + timer_id, onx_timer::control_sentence(t.name, t.total_seconds, action),
                    action == onx_timer::Action::ADD_MINUTE ? "Adding 1 min..." : action == onx_timer::Action::STOP ? "Stopping..." : action == onx_timer::Action::RESUME ? "Resuming..." : "Pausing...");
                return;
              }
            };
            onx_panel_detail::set_local_timer_active = [local_command](const std::string &key, bool active) {
              local_command(key, active ? onx_timer::Action::RESUME : onx_timer::Action::PAUSE);
            };
            onx_panel_detail::stop_local_timer = [local_command](const std::string &key) {
              local_command(key, onx_timer::Action::STOP);
            };
            onx_panel_detail::extend_local_timer = [local_command](const std::string &key) {
              local_command(key, onx_timer::Action::ADD_MINUTE);
            };
            onx_assist::overlay_visible = []() { return !lv_obj_has_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN); };
            onx_assist::running = []() { return id(assist).is_running(); };
            onx_assist::toggle = []() { id(toggle_assist).execute(); };
            onx_assist::stop = []() { id(assist_stop).execute(); };
            onx_assist::dismiss = []() {
              if (lv_obj_has_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN)) return;
              id(assist_finished).stop();
              id(assist_pulse).execute(false);
              lv_obj_add_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN);
              id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);
            };
            onx_assist::resize = [](int w, int h) { lv_obj_set_size(id(assist_overlay), w, h); };
            onx_assist::stop_alarm_sound = []() {
              id(timer_alarm_sound).stop();
              id(panel_media_player).make_call()
                  .set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_STOP).set_announcement(true).perform();
            };

script:
  # Copies the voice assistant's timers for the timer screen.
  - id: timer_sync
    then:
      - lambda: |-
          auto &state = onx_panel_detail::timers;
          state.local.clear();
          for (const auto &t : id(assist).get_timers())
            state.local.push_back({t.id, t.name, t.total_seconds, t.seconds_left, t.is_active});
          state.synced_ms = millis();
          if (state.command_pending && int32_t(millis() - state.message_until) >= 0) {
            state.message = "No timer confirmation";
            state.message_until = millis() + 5000;
            state.command_pending = false;
          }

  # One play of the finished-timer sound (timers.yaml repeats it).
  - id: timer_alarm_sound
    then:
      - media_player.speaker.play_on_device_media_file:
          id: panel_media_player
          media_file: timer_finished_sound
          announcement: true
      - delay: 500ms
      - wait_until:
          condition:
            not:
              media_player.is_announcing: panel_media_player
          timeout: 15s
      - delay: 800ms

  # Stop button (and the left-edge back swipe): stop and close the overlay.
  - id: assist_stop
    then:
      - script.stop: assist_unmute_media_deferred
      - script.execute: assist_unmute_media
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
          id(assist).request_stop();
          auto call = id(panel_media_player).make_call();
          call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_STOP).set_announcement(true).perform();
          id(assist_finished).stop();
          lv_obj_add_flag(id(assist_overlay), LV_OBJ_FLAG_HIDDEN);
          id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);

  - id: assist_set_media_mute
    mode: queued
    max_runs: 16
    parameters:
      entity: string
      muted: bool
    then:
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: !lambda 'return entity;'
            is_volume_muted: !lambda 'return muted ? std::string("true") : std::string("false");'

  - id: assist_media_command
    mode: queued
    max_runs: 16
    parameters:
      entity: string
      command: string
    then:
      - homeassistant.action:
          action: !lambda 'return "media_player." + command;'
          data:
            entity_id: !lambda 'return entity;'

  - id: assist_set_media_volume
    mode: queued
    max_runs: 16
    parameters:
      entity: string
      level: string
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda 'return entity;'
            volume_level: !lambda 'return level;'

  # Quiets registered playing media players while Assist is active (web
  # setting): pauses those that support it (feature 1), otherwise mutes them.
  - id: assist_mute_media
    then:
      - lambda: |-
          if (!onx_display_settings::assist_mute_media.enabled || !id(normal_ha_api_connected)) return;
          auto &quieted = onx_media::assist_muted;
          for (int i = 0; i < id(normal_device_count) && i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i) {
            const auto entity = id(ui_presenter)->get_normal_device_entity_id(i);
            if (entity.rfind("media_player.", 0) != 0) continue;
            const auto *d = custom_logic_entity_sub::entity_detail(entity);
            if (!d || !d->received || !d->available || d->state != "playing") continue;
            if (std::any_of(quieted.begin(), quieted.end(), [&](const auto &q) { return q.entity == entity; })) continue;
            const bool can_pause = d->features != 0 && (d->features & 1U);
            if (can_pause) {
              quieted.push_back({entity, true, ""});
              id(assist_media_command).execute(entity, std::string("media_pause"));
              continue;
            }
            if (d->muted == "True" || d->muted == "true") continue;
            if (d->features != 0 && !(d->features & 8U)) continue;
            quieted.push_back({entity, false, d->volume});
            id(assist_set_media_mute).execute(entity, true);
          }

  # Resumes paused players; unmutes muted ones and puts their volume back.
  - id: assist_unmute_media
    then:
      - lambda: |-
          if (onx_media::assist_muted.empty()) return;
          auto players = std::move(onx_media::assist_muted);
          onx_media::assist_muted.clear();
          if (!id(normal_ha_api_connected)) return;
          for (const auto &q : players) {
            if (q.paused) { id(assist_media_command).execute(q.entity, std::string("media_play")); continue; }
            id(assist_set_media_mute).execute(q.entity, false);
            char *end = nullptr;
            const float level = q.volume.empty() ? NAN : std::strtof(q.volume.c_str(), &end);
            if (std::isfinite(level) && end != q.volume.c_str() && level >= 0.0f && level <= 1.0f)
              id(assist_set_media_volume).execute(q.entity, q.volume);
          }

  - id: assist_unmute_media_deferred
    mode: restart
    then:
      - delay: 400ms
      - if:
          condition:
            not:
              or:
                - voice_assistant.is_running:
                - media_player.is_announcing: panel_media_player
          then:
            - script.execute: assist_unmute_media

  # The mute button is highlighted while the microphone is muted.
  - id: assist_sync_mute
    then:
      - lambda: |-
          const bool muted = id(microphone_muted).state;
          lv_obj_set_style_bg_color(id(assist_mute_button), lv_color_hex(muted ? onx_display_settings::accent_strong()
                                                                                : onx_display_settings::surface()), 0);

  - id: toggle_assist
    then:
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - media_player.is_announcing: panel_media_player
          then:
            - voice_assistant.stop:
            - media_player.stop:
                id: panel_media_player
                announcement: true
          else:
            - if:
                condition:
                  lambda: 'return id(assist_ready) && !id(microphone_muted).state;'
                then:
                  - voice_assistant.start:
                else:
                  - script.execute:
                      id: assist_show
                      status: !lambda |-
                        return std::string(id(microphone_muted).state ? "Microphone muted"
                                           : "Select this panel as an Assist satellite in Home Assistant");
                  - script.execute: assist_finished

  # Shows the overlay, waking the panel and taking the screen from the stream.
  - id: assist_show
    parameters:
      status: string
    then:
      - lambda: |-
          if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
          id(ui_presenter)->notify_user_activity();
          id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, true);
          // Above the bottom dock and other top-layer widgets, in the accent colour.
          lv_obj_move_foreground(id(assist_overlay));
          auto *overlay = id(assist_overlay);
          auto *conversation = id(assist_conversation);
          // A fresh session starts with an empty conversation; a continued
          // one (follow-up question, tap to talk again) keeps its history.
          const bool fresh = lv_obj_has_flag(overlay, LV_OBJ_FLAG_HIDDEN);
          if (fresh) lv_obj_clean(conversation);
          // Landscape: microphone, status, hint and buttons in a column on the
          // left, the conversation filling the right. Portrait: stacked, with
          // the conversation between the status and the hint.
          const bool landscape = onx_panel_ui::width > onx_panel_ui::height;
          auto *side = id(assist_side);
          if (landscape && lv_obj_get_parent(id(assist_hint)) != side) {
            lv_obj_set_flex_flow(overlay, LV_FLEX_FLOW_ROW);
            lv_obj_set_style_pad_column(overlay, onx_geom::S(12), 0);
            lv_obj_set_size(side, onx_panel_ui::width * 40 / 100, LV_PCT(100));
            lv_obj_set_style_pad_row(side, onx_geom::S(8), 0);
            lv_obj_set_parent(id(assist_hint), side);
            lv_obj_set_parent(id(assist_controls), side);
            lv_obj_set_style_flex_grow(id(assist_side_spacer), 1, 0);
            lv_obj_remove_flag(id(assist_side_spacer), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_size(conversation, 0, LV_PCT(100));
            lv_obj_set_style_flex_grow(conversation, 1, 0);
          }
          const auto accent = lv_color_hex(onx_display_settings::accent());
          for (auto *obj : {id(assist_mic), id(assist_mic_ring), id(assist_mic_ring_inner)})
            lv_obj_set_style_bg_color(obj, accent, 0);
          lv_obj_set_style_text_color(id(assist_status), accent, 0);
          // Bubbles and buttons follow the panel's palette.
          const auto surface = lv_color_hex(onx_display_settings::surface());
          for (auto *obj : {id(assist_mute_button), id(assist_stop_button)})
            lv_obj_set_style_bg_color(obj, surface, 0);
          lv_obj_set_style_bg_color(id(assist_overlay), lv_color_hex(onx_display_settings::background()), 0);
          lv_label_set_text(id(assist_hint), onx_panel_ui::wake_word_on && onx_panel_ui::wake_word_on()
              ? "Say your wake word or tap the microphone" : "Tap the microphone to talk");
          // A fresh session starts with the full-size microphone and hint.
          if (fresh) {
            id(assist_compact) = false;
            id(assist_mic_scale).execute(false);
          }
          // Existing bubbles follow a palette change.
          const auto user_bg = lv_color_hex(onx_display_settings::control_surface());
          for (uint32_t i = 0; i < lv_obj_get_child_count(conversation); i++) {
            auto *row = lv_obj_get_child(conversation, i);
            auto *bubble = lv_obj_get_child(row, 0);
            if (bubble) lv_obj_set_style_bg_color(bubble, lv_obj_get_style_flex_main_place(row, LV_PART_MAIN) == LV_FLEX_ALIGN_END
                                                            ? user_bg : surface, 0);
          }
      - script.execute: assist_sync_mute
      - lvgl.label.update:
          id: assist_status
          text: !lambda 'return status;'
      - lvgl.widget.show: assist_overlay

  # While listening the inner ring breathes out towards the outer one and the
  # outer ring brightens. Sizes inside the fixed outer ring, so nothing reflows
  # and no transform buffer is needed.
  - id: assist_pulse
    parameters:
      active: bool
    then:
      - lambda: |-
          auto *inner = id(assist_mic_ring_inner), *outer = id(assist_mic_ring);
          // Only the inner ring's size and the outer ring's opacity animate
          // here; the current microphone scale (assist_mic_scale) is kept.
          lv_anim_delete(inner, nullptr);
          lv_anim_delete(outer, nullptr);
          const int percent = id(assist_mic_percent);
          const int outer_size = onx_geom::S(120) * percent / 100;
          lv_obj_set_size(outer, outer_size, outer_size);
          lv_obj_set_style_radius(outer, outer_size / 2, 0);
          const int base = onx_geom::S(94) * percent / 100, full = onx_geom::S(118) * percent / 100;
          lv_obj_set_size(inner, base, base);
          lv_obj_set_style_radius(inner, base / 2, 0);
          lv_obj_set_style_bg_opa(outer, LV_OPA_20, 0);
          if (!active) return;
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, inner);
          lv_anim_set_values(&a, base, full);
          lv_anim_set_duration(&a, 750);
          lv_anim_set_reverse_duration(&a, 750);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&a, [](void *o, int32_t v) {
            auto *obj = static_cast<lv_obj_t *>(o);
            lv_obj_set_size(obj, v, v);
            lv_obj_set_style_radius(obj, v / 2, 0);
          });
          lv_anim_start(&a);
          lv_anim_t b;
          lv_anim_init(&b);
          lv_anim_set_var(&b, outer);
          lv_anim_set_values(&b, LV_OPA_20, LV_OPA_40);
          lv_anim_set_duration(&b, 750);
          lv_anim_set_reverse_duration(&b, 750);
          lv_anim_set_repeat_count(&b, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_path_cb(&b, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&b, [](void *o, int32_t v) { lv_obj_set_style_bg_opa(static_cast<lv_obj_t *>(o), v, 0); });
          lv_anim_start(&b);

  # Appends a bubble to the conversation (what was heard on the right, the
  # reply on the left), drops the oldest beyond a short history and scrolls
  # so the newest is in view: a long bubble shows from its first line.
  - id: assist_add_bubble
    parameters:
      text: string
      user: bool
    then:
      - lambda: |-
          if (text.empty()) return;
          auto *conversation = id(assist_conversation);
          // Bubbles are created here, so the column layout is set here too.
          lv_obj_set_flex_flow(conversation, LV_FLEX_FLOW_COLUMN);
          lv_obj_set_style_pad_row(conversation, onx_geom::S(8), 0);
          while (lv_obj_get_child_count(conversation) >= 8) lv_obj_delete(lv_obj_get_child(conversation, 0));
          auto *row = lv_obj_create(conversation);
          lv_obj_remove_style_all(row);
          lv_obj_set_size(row, LV_PCT(100), LV_SIZE_CONTENT);
          lv_obj_set_flex_flow(row, LV_FLEX_FLOW_ROW);
          lv_obj_set_flex_align(row, user ? LV_FLEX_ALIGN_END : LV_FLEX_ALIGN_START,
                                LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
          lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_add_flag(row, LV_OBJ_FLAG_SCROLL_CHAIN_VER);
          auto *bubble = lv_obj_create(row);
          lv_obj_remove_style_all(bubble);
          lv_obj_set_size(bubble, LV_SIZE_CONTENT, LV_SIZE_CONTENT);
          lv_obj_set_style_radius(bubble, onx_geom::S(14), 0);
          lv_obj_set_style_bg_opa(bubble, LV_OPA_COVER, 0);
          lv_obj_set_style_bg_color(bubble, lv_color_hex(user ? onx_display_settings::control_surface()
                                                              : onx_display_settings::surface()), 0);
          lv_obj_set_style_pad_hor(bubble, onx_geom::S(12), 0);
          lv_obj_set_style_pad_ver(bubble, onx_geom::S(8), 0);
          lv_obj_remove_flag(bubble, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_add_flag(bubble, LV_OBJ_FLAG_SCROLL_CHAIN_VER);
          auto *label = lv_label_create(bubble);
          lv_label_set_long_mode(label, LV_LABEL_LONG_WRAP);
          lv_obj_set_width(label, LV_SIZE_CONTENT);
          lv_obj_update_layout(conversation);
          lv_obj_set_style_max_width(label, lv_obj_get_content_width(conversation) * 80 / 100, 0);
          lv_obj_set_style_text_font(label, id(fonts_MiSans_Medium_14)->get_lv_font(), 0);
          lv_obj_set_style_text_color(label, lv_color_hex(user ? 0xFFFFFF : 0xD2D2D2), 0);
          lv_label_set_text(label, text.c_str());
          lv_obj_update_layout(conversation);
          // Once the conversation overflows, make room for it: hide the hint
          // and shrink the microphone (animated) for the rest of the session.
          if (!id(assist_compact) && lv_obj_get_scroll_top(conversation) + lv_obj_get_scroll_bottom(conversation) > 0) {
            id(assist_compact) = true;
            id(assist_mic_scale).execute(true);
            lv_obj_update_layout(conversation);
          }
          lv_obj_scroll_to_view(row, LV_ANIM_ON);

  # Sizes the microphone rings and shows/hides the hint for the current mode:
  # full size in portrait, 3/4 in landscape (room for the buttons below it),
  # and half size with no hint once the conversation needs the space.
  - id: assist_mic_scale
    parameters:
      animate: bool
    then:
      - lambda: |-
          const bool landscape = onx_panel_ui::width > onx_panel_ui::height;
          const bool compact = id(assist_compact);
          const int percent = compact ? 50 : landscape ? 75 : 100;
          id(assist_mic_percent) = percent;
          // Short landscape screens: the microphone already says "tap to talk".
          if (compact || (landscape && onx_panel_ui::height < 300)) lv_obj_add_flag(id(assist_hint), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(assist_hint), LV_OBJ_FLAG_HIDDEN);
          struct Ring { lv_obj_t *obj; int base; };
          const Ring rings[] = {{id(assist_mic_ring), onx_geom::S(120)},
                                {id(assist_mic_ring_inner), onx_geom::S(94)},
                                {id(assist_mic), onx_geom::S(68)}};
          // The emoji shrinks with the microphone (transform scale, 256 = 1x).
          auto *icon = lv_obj_get_child(id(assist_mic), 0);
          for (const auto &ring : rings) {
            const int target = ring.base * percent / 100;
            const int from = lv_obj_get_width(ring.obj);
            auto apply = [](void *o, int32_t v) {
              auto *obj = static_cast<lv_obj_t *>(o);
              lv_obj_set_size(obj, v, v);
              lv_obj_set_style_radius(obj, v / 2, 0);
            };
            lv_anim_delete(ring.obj, nullptr);
            if (!animate || from <= 0 || from == target) { apply(ring.obj, target); continue; }
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, ring.obj);
            lv_anim_set_values(&a, from, target);
            lv_anim_set_duration(&a, 300);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
            lv_anim_set_exec_cb(&a, apply);
            lv_anim_start(&a);
          }
          if (icon) {
            const int scale = 256 * percent / 100;
            lv_obj_set_style_transform_pivot_x(icon, LV_PCT(50), 0);
            lv_obj_set_style_transform_pivot_y(icon, LV_PCT(50), 0);
            lv_anim_delete(icon, nullptr);
            auto apply = [](void *o, int32_t v) { lv_obj_set_style_transform_scale(static_cast<lv_obj_t *>(o), v, 0); };
            const int from = lv_obj_get_style_transform_scale_x(icon, LV_PART_MAIN);
            if (!animate || from == scale) apply(icon, scale);
            else {
              lv_anim_t a;
              lv_anim_init(&a);
              lv_anim_set_var(&a, icon);
              lv_anim_set_values(&a, from, scale);
              lv_anim_set_duration(&a, 300);
              lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
              lv_anim_set_exec_cb(&a, apply);
              lv_anim_start(&a);
            }
          }

  # Leave the reply on screen briefly, then return to the previous view.
  - id: assist_finished
    mode: restart
    then:
      - delay: 6s
      - if:
          condition:
            not:
              or:
                - voice_assistant.is_running:
                - media_player.is_announcing: panel_media_player
          then:
            - script.execute:
                id: assist_pulse
                active: false
            - lvgl.widget.hide: assist_overlay
            - lambda: 'id(room_panel)->set_overlay(esphome::room_companion::OVERLAY_ASSIST, false);'

lvgl:
  top_layer:
    widgets:
      # Laid out like Home Assistant's voice dialog: the microphone in rings,
      # the status, the conversation as bubbles (what was heard on the right,
      # the reply on the left), a hint, then mute and Stop along the bottom.
      - obj:
          id: assist_overlay
          hidden: true
          x: 0
          y: 0
          width: ${display_width}
          height: ${display_height}
          radius: 0
          bg_color: 0x101418
          bg_opa: COVER
          border_width: 0
          pad_all: ${ (16 * (ui_scale | float)) | round | int }
          pad_bottom: ${ (12 * (ui_scale | float)) | round | int }
          scrollable: false
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_cross: CENTER
            pad_row: ${ (8 * (ui_scale | float)) | round | int }
          widgets:
            # Microphone and status; in landscape also the hint and buttons.
            - obj:
                id: assist_side
                width: 100%
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: ${ (8 * (ui_scale | float)) | round | int }
                widgets:
                  # Microphone: tap to talk again, or to stop listening/speaking.
                  - obj:
                      id: assist_mic_ring
                      width: ${ (120 * (ui_scale | float)) | round | int }
                      height: ${ (120 * (ui_scale | float)) | round | int }
                      radius: ${ (60 * (ui_scale | float)) | round | int }
                      bg_color: 0x62B0FF
                      bg_opa: 18%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      on_click:
                        - script.execute: toggle_assist
                      widgets:
                        - obj:
                            id: assist_mic_ring_inner
                            align: center
                            width: ${ (94 * (ui_scale | float)) | round | int }
                            height: ${ (94 * (ui_scale | float)) | round | int }
                            radius: ${ (47 * (ui_scale | float)) | round | int }
                            bg_color: 0x62B0FF
                            bg_opa: 30%
                            border_width: 0
                            pad_all: 0
                            scrollable: false
                            clickable: false
                            widgets:
                              - obj:
                                  id: assist_mic
                                  align: center
                                  width: ${ (68 * (ui_scale | float)) | round | int }
                                  height: ${ (68 * (ui_scale | float)) | round | int }
                                  radius: ${ (34 * (ui_scale | float)) | round | int }
                                  bg_color: 0x62B0FF
                                  bg_opa: COVER
                                  border_width: 0
                                  pad_all: 0
                                  scrollable: false
                                  clickable: false
                                  widgets:
                                    - label:
                                        align: center
                                        text: "🎤"
                                        text_font: fonts_MiSans_Medium_32
                                        text_color: 0xFFFFFF
                  # Listening... / Thinking... / Speaking... or an error.
                  - label:
                      id: assist_status
                      text: ""
                      width: 100%
                      long_mode: DOT
                      text_align: CENTER
                      text_font: fonts_MiSans_Medium_14
                      text_color: 0x62B0FF
                  # Pushes the hint and buttons to the bottom (landscape only).
                  - obj:
                      id: assist_side_spacer
                      hidden: true
                      width: 1
                      height: 0
                      bg_opa: TRANSP
                      border_width: 0
                      clickable: false
                      scrollable: false
            # The conversation, scrolled to the newest bubble.
            - obj:
                id: assist_conversation
                width: 100%
                flex_grow: 1
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                pad_top: ${ (6 * (ui_scale | float)) | round | int }
                scrollbar_mode: AUTO
                scroll_dir: VER
            - label:
                id: assist_hint
                text: "Tap the microphone to talk"
                width: 100%
                long_mode: DOT
                text_align: CENTER
                text_font: fonts_MiSans_Medium_12
                text_color: 0x9C9C9E
            # Mute and Stop.
            - obj:
                id: assist_controls
                width: 100%
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: ${ (8 * (ui_scale | float)) | round | int }
                widgets:
                  - obj:
                      id: assist_mute_button
                      width: ${ (44 * (ui_scale | float)) | round | int }
                      height: ${ (44 * (ui_scale | float)) | round | int }
                      radius: ${ (12 * (ui_scale | float)) | round | int }
                      bg_color: 0x232323
                      bg_opa: COVER
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      on_click:
                        - switch.toggle: microphone_muted
                        - script.execute: assist_sync_mute
                      widgets:
                        - image:
                            align: center
                            src: panel_mic_off_icon
                            image_recolor: 0xFFFFFF
                            image_recolor_opa: COVER
                  - obj:
                      id: assist_stop_button
                      flex_grow: 1
                      height: ${ (44 * (ui_scale | float)) | round | int }
                      radius: ${ (12 * (ui_scale | float)) | round | int }
                      bg_color: 0x232323
                      bg_opa: COVER
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      on_click:
                        - script.execute: assist_stop
                      widgets:
                        - label:
                            align: center
                            text: "Stop"
                            text_font: fonts_MiSans_Medium_14
                            text_color: 0xFFFFFF

image:
  - platform: file
    file: "../../../assets/panel/microphone-off.svg"
    id: panel_mic_off_icon
    resize: ${ (22 * (ui_scale | float)) | round | int }x${ (22 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
