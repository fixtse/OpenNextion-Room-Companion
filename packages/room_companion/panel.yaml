substitutions:
  # Private builds can override this with a full Bearer header from secrets.yaml.
  immichframe_authorization: ""
  # Internal RAM (total / largest contiguous block, bytes) that must be free
  # before Bluetooth may start; see the esp32_ble comment below.
  ble_min_free: "56000"
  ble_min_block: "36000"

# Panel layer: display/input integration and connectivity for these boards.
# Everything else comes from the shared packages.
logger:
  # CH340 USB-to-UART on GPIO43/44 carries logs and Improv Serial; GPIO19/20
  # (USB-Serial-JTAG) belong to the PDM microphone.
  hardware_uart: UART0
  baud_rate: 115200

# The base auxiliary UART would use GPIO43/44, which are the console here.
uart: !remove

# Public firmware uses an unencrypted API; provisioning stays in device NVS.
api:
  encryption: !remove
  # Optional synced lyrics from the Room Companion Home Assistant integration.
  actions:
    - action: set_lyrics
      description: Synced LRC lyrics for a media player's current track; an empty lrc clears them.
      variables:
        entity_id: string
        title: string
        lrc: string
      then:
        - lambda: |-
            if (lrc.empty()) onx_lyrics::clear();
            else if (!onx_lyrics::set(entity_id, title, lrc)) ESP_LOGW("lyrics", "No timed lines for %s", title.c_str());
            else ESP_LOGI("lyrics", "%d lines for %s", onx_lyrics::count(), title.c_str());
    - action: set_lyrics_offset
      description: Lyrics sync correction in milliseconds; positive shows each line earlier.
      variables:
        offset_ms: int
      then:
        - lambda: |-
            onx_lyrics::set_offset(offset_ms);
    # For Assist or automations: wake the panel and show a configured entity's
    # page, or its detail screen when detail is true.
    - action: show_entity
      description: Show the page of a configured entity (detail=true opens its detail screen).
      variables:
        entity_id: string
        detail: bool
      then:
        - lambda: |-
            const int config = onx_panel_pages::configured(entity_id);
            if (config < 0) { ESP_LOGW("panel", "show_entity: %s is not on this panel", entity_id.c_str()); return; }
            id(panel_show_entity).execute(config, detail);
    # Sent by the Room Companion integration (github.com/fixtse/ha-room-companion):
    # icons, emoji, covers and the lyrics backdrop then come from Home Assistant.
    - action: set_companion
      description: Base URL of this panel's assets in the Room Companion integration; empty turns it off.
      variables:
        url: string
      then:
        - lambda: |-
            if (!onx_companion::set(url)) { ESP_LOGW("companion", "Ignored invalid URL"); return; }
            ESP_LOGI("companion", "%s", url.empty() ? "Off" : "Assets from Home Assistant");
            id(entity_icon_downloader)->retry();
            onx_media::artwork_refresh_pending = true;

lvgl:
  id: lvgl_ui
  # Referencing the symbol font compiles it in for the media control symbols.
  top_layer:
    widgets:
      - label:
          id: panel_symbol_font_ref
          hidden: true
          text_font: ${symbol_font}
          text: ""
      # ESPHome compiles only the LVGL widget types the YAML uses. The redesigned
      # screens create arcs in C++ (timers, rings), and no YAML arc remains.
      - arc:
          id: panel_arc_ref
          hidden: true
  displays:
    - lcd_display
  # Touch reaches LVGL only for overlays (notification centre); the base pages
  # are driven through onx_touch_input.
  touchscreens:
    - touchscreen_id: panel_touch
  resume_on_input: false
  byte_order: big_endian
  update_interval: 16ms
  # Keep partial-refresh mode, but let a carousel-sized invalidation fit in
  # one PSRAM buffer. A 12.5% internal-RAM buffer was measured on 2026-11-20:
  # LVGL time doubled (13.1 s vs 6.2 s per minute), frame times did not
  # improve and the wake-word audio ring buffer overflowed
  # (docs/room-companion/touch-latency.md).
  buffer_size: 100%
  default_font: fonts_MiSans_Medium_14
  log_level: WARN

# Larger idle clock digits, used when the chosen clock content leaves room.
font:
  - file: "../../fonts/MiSans-Bold.ttf"
    id: panel_clock_big_font
    size: ${ (88 * (font_scale | float)) | round | int }
    bpp: ${font_bpp}
    glyphs: "0123456789:-. "

select:
  # Current carousel page, for automations: choose a page to show it.
  # Options follow the page list (names, or the first entity's title).
  - platform: template
    id: panel_page_select
    name: Page
    icon: mdi:book-open-page-variant-outline
    options:
      - None
    initial_option: None
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const auto titles = onx_panel_pages::page_titles();
          const auto it = std::find(titles.begin(), titles.end(), x);
          if (it == titles.end()) return;
          const int entry = onx_panel_pages::lead(onx_panel_pages::stored.pages[it - titles.begin()]);
          if (onx_panel_pages::entry_entity(entry).empty()) return;
          if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
          if (id(ui_presenter)->is_standby_active()) id(exit_standby_mode).execute();
          id(ui_presenter)->notify_user_activity();
          if (id(normal_device_detail_active)) id(exit_normal_switch_detail).execute();
          id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(entry);
          id(show_normal_device_entry_page).execute(0);
          id(panel_page_select).publish_state(size_t(it - titles.begin()));
          onx_assist::dismiss();
  # Every configured entity by name, for Assist and automations: choose one to
  # open its detail screen. Only this select needs exposing to Assist.
  - platform: template
    id: panel_entity_select
    name: Show entity
    icon: mdi:gesture-tap-button
    options:
      - None
    initial_option: None
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const auto entities = onx_panel_pages::entity_titles();
          for (size_t i = 0; i < entities.size(); ++i) {
            if (entities[i].first != x) continue;
            id(panel_show_entity).execute(entities[i].second, true);
            id(panel_entity_select).publish_state(i);
            return;
          }
  - platform: template
    id: panel_idle_screen
    name: Idle screen
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Clock
      - Dashboard
      - ImmichFrame
    initial_option: Clock
  # How ImmichFrame fits each photo (the server draws it; see panel-ui.md).
  - platform: template
    id: panel_immichframe_fit
    name: ImmichFrame photo fit
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_value: true
    options:
      - Blurred background
      - Fill screen
      - Whole photo
    initial_option: Blurred background
  # The clock over photos: large (time, date, weather, media), small (a thinner
  # band) or photo only (the time in a corner pill).
  - platform: template
    id: panel_photo_overlay
    name: Clock on photos
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_value: true
    options:
      - Large clock
      - Small clock
      - Photo only
    initial_option: Large clock

switch:
  # Two photos side by side (or stacked) when one alone would not suit the screen.
  - platform: template
    id: panel_immichframe_split
    name: ImmichFrame photo pairs
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Photo details drawn by ImmichFrame in the top-left corner (at most three).
  - platform: template
    id: panel_immichframe_info_date
    name: ImmichFrame show date
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: panel_immichframe_info_location
    name: ImmichFrame show place
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: panel_immichframe_info_album
    name: ImmichFrame show album
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_immichframe_info_people
    name: ImmichFrame show people
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_immichframe_info_description
    name: ImmichFrame show description
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panel_slideshow_fade
    name: Slideshow fade
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

text:
  - platform: template
    id: panel_immichframe_url
    name: ImmichFrame server
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""

number:
  - platform: template
    id: panel_slideshow_seconds
    name: Slideshow interval
    # Set from the web setup (Idle screen page); not exposed to Home Assistant.
    internal: true
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 20

# Bluetooth is not started at boot: with the saved configuration the internal RAM
# left after setup (about 45 KB with nine controls) is less than the Bluedroid
# stack needs, and its failure aborts the boot. It is only used for Improv Wi-Fi
# provisioning, so it starts when the panel has no saved network (after 10 s) or
# the network has been unavailable for 30 s, when memory allows (onx_ble_guard.h).
esp32_ble:
  enable_on_boot: false

interval:
  # Downloads the integration's lyrics backdrop while no artwork downloads.
  - interval: 250ms
    then:
      - lambda: |-
          auto *img = id(lyrics_backdrop_image);
          if (img->is_busy()) return;
          if (onx_media::backdrop_release) { onx_media::backdrop_release = false; img->release(); }
          const auto &want = onx_panel_detail::backdrop_wanted;
          if (want.empty() || want == onx_media::backdrop_requested) return;
          if (onx_media::downloading || id(media_cover_image)->is_busy() || id(entity_icon_downloader)->busy() ||
              !img->memory_ready() || id(screen_off_state) || id(sleep_mode_state)) return;
          onx_media::backdrop_requested = want;
          img->set_url(want);
          img->update();
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              auto *wifi_component = wifi::global_wifi_component;
              static uint32_t warned = 0;
              if (wifi_component == nullptr || wifi_component->is_connected()) return false;
              if (esphome::esp32_ble::global_ble != nullptr && esphome::esp32_ble::global_ble->is_active()) {
                onx_ble_guard::done();
                return false;
              }
              const bool saved = wifi_component->has_sta() && !wifi_component->get_sta().get_ssid().empty();
              // A provisioned panel never automatically reopens Bluetooth,
              // including slow Wi-Fi reconnects after a reboot. USB Improv and
              // the setup AP remain available for network recovery.
              if (saved || millis() < 10000) return false;
              if (onx_ble_guard::blocked()) return false;
              if (!onx_ble_guard::enough_memory(${ble_min_free}, ${ble_min_block})) {
                if (millis() - warned > 60000) {
                  warned = millis();
                  ESP_LOGW("ble", "Not starting Bluetooth: internal RAM %u B free, largest block %u B",
                           (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                           (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
                }
                return false;
              }
              onx_ble_guard::begin();
              return true;
          then:
            - ble.enable:
  # Rectangular-panel UI (onx_panel_ui.h): bell, media layout, idle screen.
  # Runs every 100 ms, or on the next 16 ms check after a tap requested it.
  - interval: 16ms
    then:
      - lambda: |-
          static uint32_t last_pass = 0;
          if (!onx_panel_ui::render_requested && millis() - last_pass < 100) return;
          const bool requested = onx_panel_ui::render_requested;
          onx_panel_ui::render_requested = false;
          last_pass = millis();
          if (onx_panel_pages::layer == nullptr) return;
          onx_notification_ui::cover_root = onx_panel_pages::layer;  // Hidden while the centre covers it.
          // Fully covered native content keeps its last frame without rebuilding.
          if (onx_notification_ui::panel_open || onx_notification_ui::detail_id != 0) return;
          // The timer screen (features/timers.yaml) covers the
          // screen, except while Assist itself is on screen.
          static bool timers_were_up = false;
          const bool timers_up = onx_panel_detail::timers.overlay && !onx_assist::overlay_visible();
          const bool raise_timers = timers_up && !timers_were_up;
          timers_were_up = timers_up;
          if (timers_up) {
            onx_notification_ui::set_bell_visible(false);
            // The shared Wi-Fi/HA status icons (top layer) belong to the carousel and idle clock.
            for (auto *icon : {id(normal_device_wifi_online_widget), id(normal_device_wifi_offline_widget),
                               id(normal_device_homeassistant_online_widget), id(normal_device_homeassistant_offline_widget)})
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
            onx_panel_pages::show_timers(onx_panel_ui::width, onx_panel_ui::height, raise_timers);
            if (raise_timers) onx_notification_ui::refresh();  // Keep banners above it.
            return;
          }
          // Native rectangular pages reuse the existing HA state and actions.
          const bool detail = id(normal_device_detail_active);
          if (!detail && !onx_panel_pages::parent_entity.empty()) {
            const int config = onx_panel_pages::configured(onx_panel_pages::parent_entity);
            onx_panel_pages::parent_entity.clear();
            if (config >= 0) {
              id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
              id(show_normal_device_entry_page).execute(0);
            }
          }
          const bool entity_detail = detail && (id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_AUTOMATION ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_LIGHT || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_SWITCH ||
              id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_PLUG || id(normal_device_detail_kind)==NORMAL_DEVICE_DETAIL_KIND_CURTAIN);
          const bool standby = id(ui_presenter)->is_standby_active();
          static bool was_standby = false;
          const bool entered = standby && !was_standby;
          const bool exited = !standby && was_standby;
          was_standby = standby;
          // Load a fully populated standby page before hiding the opaque card layer.
          // The periodic standby refresh remains responsible for later updates.
          const auto idle_mode = id(panel_idle_screen).active_index().value_or(0);
          if (standby && !id(screen_off_state) && !id(sleep_mode_state) &&
              (idle_mode == onx_panel_ui::IDLE_CLOCK || idle_mode == onx_panel_ui::IDLE_IMMICHFRAME) &&
              lv_scr_act() != id(standby_page)->obj)
            id(refresh_normal_standby_page).execute();
          const bool normal = id(ui_presenter)->is_normal_mode_active() && !standby &&
              !id(screen_off_state) && !id(sleep_mode_state) && id(room_panel)->native_ui_can_render() &&
              // Timer popups open the timer detail, drawn here like any other.
              !onx_notification::current.visible;
          // Restore the dock and status icons in the same pass as the cards.
          // The normal periodic refresh only runs once a second.
          if (exited && normal && !detail && id(normal_page_index) == 0)
            id(refresh_normal_device_page).execute();
          const int index = detail ? id(normal_device_detail_index) : id(normal_device_selected_index);
          const auto entity = index >= 0 && index < id(normal_device_count) ?
              id(ui_presenter)->get_normal_device_entity_id(index) : std::string();
          if (entity_detail && normal && id(normal_ha_api_connected)) {
            const int sensor = onx_sensor_view::index(entity);
            if (sensor >= 0 && onx_sensor_view::configs[sensor].graph &&
                onx_sensor_view::states[sensor].request_due(millis()))
              id(request_normal_sensor_history).execute(entity);
            const auto *weather = entity.rfind("weather.", 0) == 0 ? custom_logic_entity_sub::entity_detail(entity) : nullptr;
            if (weather && weather->available && weather->forecast_due(millis()))
              id(request_normal_weather_forecast).execute(entity);
          }
          // Media keeps its specialised artwork/transport view. Main pages and
          // generic details use the entire rectangle, without the round ring.
          if (normal && !entity.empty() && ((!detail && id(normal_page_index)==0) || entity_detail)) {
            // Rebuilding a view and its signature costs ~6-16 ms on the 3.5-inch
            // panel, so the carousel and details redraw only after a tap, a Home
            // Assistant state change, a screen switch, or once a second for slower
            // sources (icon and artwork downloads, history, settings, the clock).
            // Media progress, lyrics and timer countdowns still move every pass.
            static uint32_t seen_revision = 0, last_full_ms = 0;
            static std::string last_carousel;
            const std::string key = (detail ? "d:" : "c:") + entity;
            // Main pages (up to 12 cards) cost ~50 ms to re-check, so the
            // once-a-second refresh first compares a cheap key of what they can
            // show; a full check still runs every 10 s for anything it misses.
            static uint32_t last_inputs = 0;
            uint32_t inputs = 2166136261u;
            auto mix = [&inputs](uint32_t v) { inputs = (inputs ^ v) * 16777619u; };
            mix(custom_logic::entity_revision); mix(onx_panel_pages::seen_revision);
            mix(onx_display_settings::accent()); mix(onx_display_settings::background());
            mix(uint32_t(std::time(nullptr) / 60)); mix(onx_lyrics::store().version);
            for (char c : onx_media::ready_url) mix(uint8_t(c));
            // Timer cards count down locally: they change every second.
            for (int i = 0; i < onx_panel_pages::count; ++i)
              if (onx_panel_pages::entities[i].rfind("timer.", 0) == 0 || custom_logic_entity_sub::is_timer_detail(onx_panel_pages::entities[i])) {
                mix(uint32_t(std::time(nullptr))); break;
              }
            static uint32_t last_tick_ms = 0;
            const bool timer_due = millis() - last_tick_ms >= 1000;
            const bool main_quiet = !detail && inputs == last_inputs && millis() - last_full_ms < 10000;
            const bool full = requested || onx_subs::state_revision != seen_revision ||
                              (key != last_carousel && (detail || onx_panel_pages::page_lead != entity)) ||
                              (timer_due && !main_quiet);
            if (!full && key != last_carousel) {
              // Synchronously rendered by show_normal_device_entry_page; sync tracking without re-rendering.
              last_carousel = key; last_inputs = inputs; last_full_ms = millis();
            }
            if (timer_due) last_tick_ms = millis();
            static uint32_t seen_icon_rev = 0;
            const uint32_t cur_icon_rev = id(entity_icon_downloader)->cache_revision();
            const bool icons_changed = cur_icon_rev != seen_icon_rev;
            if (icons_changed) seen_icon_rev = cur_icon_rev;
            if (!full && (timer_due || icons_changed)) onx_panel_detail::refresh_icons();  // Downloaded icons (~0.1 ms).
            if (full) {
              seen_revision = onx_subs::state_revision; last_full_ms = millis();
              last_carousel = key; last_inputs = inputs;
              onx_panel_pages::render(entity, onx_panel_ui::width, onx_panel_ui::height, detail, [](lv_obj_t *icon, const std::string &target) {
                id(apply_normal_entity_icon).execute(icon,target,"",false);
              });
            } else {
              onx_panel_detail::tick_media_progress();
              if (detail) onx_panel_detail::tick_timers();
            }
          } else if (normal && !detail && id(normal_page_index)==0 && lv_scr_act() == id(normal_panel_page)->obj) {
            onx_panel_pages::render_settings(onx_panel_ui::width, onx_panel_ui::height);
          } else onx_panel_pages::hide();
          static uint32_t last_main_artwork = 0;
          static std::string last_main_art_entity;
          if ((!detail || onx_panel_detail::active) && normal && !onx_media::main_entity.empty() &&
              (onx_media::main_entity != last_main_art_entity || millis() - last_main_artwork >= 1000)) {
            last_main_art_entity = onx_media::main_entity;
            last_main_artwork = millis();
            id(refresh_normal_media_cover).execute();
          } else if (onx_media::main_entity.empty()) {
            last_main_art_entity.clear();
          }
          // Idle neighbor pre-warming: warm page+1 after 600 ms idle and page-1 after
          // 1100 ms idle (one per pass) so the next swipe hits a warm PSRAM/widget cache.
          if (normal && !detail && id(normal_page_index) == 0 && !onx_media::downloading &&
              !id(touch_input)->interaction_pending() && id(ui_presenter)->user_idle_ms() >= 600) {
            static std::string warmed_for;
            static uint32_t warmed_rev = 0;
            static uint8_t warmed_stage = 0;
            const uint32_t rev = custom_logic::entity_revision ^ onx_panel_pages::seen_revision;
            if (warmed_for != entity || warmed_rev != rev) {
              warmed_for = entity; warmed_rev = rev; warmed_stage = 0;
            }
            if (warmed_stage < 2 && (warmed_stage == 0 || id(ui_presenter)->user_idle_ms() >= 1100)) {
              const auto order = onx_panel_pages::order();
              const int n = int(order.size());
              if (n > 1) {
                const int cur_slot = id(normal_device_selected_index);
                const auto it = std::find(order.begin(), order.end(), cur_slot);
                if (it != order.end()) {
                  const int pos = int(it - order.begin());
                  const int dir = warmed_stage == 0 ? 1 : -1;
                  const int nb_slot = order[(pos + dir + n) % n];
                  if (nb_slot >= 0 && nb_slot < id(normal_device_count)) {
                    const auto nb_entity = id(ui_presenter)->get_normal_device_entity_id(nb_slot);
                    onx_panel_pages::prewarm(nb_entity, onx_panel_ui::width, onx_panel_ui::height);
                  }
                }
              }
              ++warmed_stage;
            }
          }
          // The bell (with its unread count) belongs to the main carousel; other
          // screens open the centre by pulling down from the top edge. The
          // dashboard also has an automatic shortcut when a URL is configured.
          const bool main_carousel = normal && !detail && id(normal_page_index) == 0;
          static bool was_main_carousel = false;
          const bool entered_main = main_carousel && !was_main_carousel;
          was_main_carousel = main_carousel;
          onx_notification_ui::set_bell_visible(normal && !detail && onx_navigation::visible);
          // Timer & music chips: refresh immediately on entering the main carousel
          // (or every 1 s) so they never lag behind or overlap Wi-Fi/HA icons.
          static uint32_t last_chip = 0;
          if (entered_main || millis() - last_chip >= 1000) {
            last_chip = millis();
            // Only active (or ringing) timers; paused ones stay on the timer screen.
            int count = 0; double soonest = -1;
            for (const auto &t : onx_panel_detail::all_timers()) {
              if (t.state != "active" && t.state != "ringing") continue;
              ++count;
              if (soonest < 0 || t.left < soonest) soonest = t.left;
            }
            onx_notification_ui::set_timer_chip(count == 0 ? std::string() :
                onx_timer::countdown(soonest) + (count > 1 ? " +" + std::to_string(count - 1) : std::string()));
            // Music chip: a configured player that is playing (the selected one first).
            auto playing = [&](int i) {
              if (i < 0 || i >= id(normal_device_count)) return false;
              const auto entity = id(ui_presenter)->get_normal_device_entity_id(i);
              const auto *d = custom_logic_entity_sub::entity_detail(entity);
              return entity.rfind("media_player.", 0) == 0 && d && d->received && d->available && d->state == "playing";
            };
            int player = playing(id(normal_device_selected_index)) ? id(normal_device_selected_index) : -1;
            for (int i = 0; player < 0 && i < id(normal_device_count) && i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i)
              if (playing(i)) player = i;
            onx_panel_ui::playing_index = player;
            onx_notification_ui::set_media_chip(player >= 0);
          }
          // With Wi-Fi and HA online the status row replaces their icons;
          // otherwise it sits by the bell. Synchronise icon visibility in this
          // same pass so Wi-Fi/HA icons never flash behind the timer/music chip.
          const bool both_online = id(normal_wifi_connected) && id(normal_ha_api_connected);
          onx_notification_ui::set_status_centered(both_online);
          if (!standby && !main_carousel) {
            for (auto *icon : {id(normal_device_wifi_online_widget), id(normal_device_wifi_offline_widget),
                               id(normal_device_homeassistant_online_widget), id(normal_device_homeassistant_offline_widget)})
              lv_obj_add_flag(icon, LV_OBJ_FLAG_HIDDEN);
          } else if (main_carousel && both_online && onx_notification_ui::has_status_chips()) {
            lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          }
          // Online Wi-Fi/HA icons are white artwork: dark on light themes,
          // left white over ImmichFrame photos. Offline icons stay red.
          {
            const bool photos = standby && id(panel_idle_screen).active_index().value_or(0) == onx_panel_ui::IDLE_IMMICHFRAME;
            const bool tint = onx_display_settings::light_background() && !photos;
            for (auto *icon : {id(normal_device_wifi_online_widget), id(normal_device_homeassistant_online_widget)}) {
              onx_render::style_image_recolor(icon, lv_color_hex(onx_display_settings::foreground()), 0);
              onx_render::style_image_recolor_opa(icon, tint ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            }
          }
          // "Page" select: keep its options and the shown page current (1 s).
          static uint32_t last_page_sync = 0;
          if (millis() - last_page_sync >= 1000) {
            last_page_sync = millis();
            static std::vector<std::string> page_options;
            auto titles = onx_panel_pages::page_titles();
            if (titles.empty()) titles.push_back("None");
            auto *select = id(panel_page_select);
            bool options_changed = false;
            if (titles != page_options) {
              page_options = std::move(titles);
              esphome::FixedVector<const char *> options;
              options.init(page_options.size());
              for (const auto &t : page_options) options.push_back(t.c_str());
              select->traits.set_options(options);
              options_changed = true;
            }
            static std::vector<std::string> entity_options;
            std::vector<std::string> names;
            for (auto &t : onx_panel_pages::entity_titles()) names.push_back(std::move(t.first));
            if (names.empty()) names.push_back("None");
            if (names != entity_options) {
              entity_options = std::move(names);
              esphome::FixedVector<const char *> options;
              options.init(entity_options.size());
              for (const auto &t : entity_options) options.push_back(t.c_str());
              id(panel_entity_select)->traits.set_options(options);
              options_changed = true;
            }
            // Home Assistant reads a select's options when it connects.
            static bool first = true;
            if (options_changed && !first) custom_logic::disconnect_all_clients_for_refresh(id(api_server));
            if (options_changed) first = false;
            const int config = onx_panel_pages::configured(
                id(ui_presenter)->get_normal_device_entity_id(id(normal_device_selected_index)));
            const int page = onx_panel_pages::page_of_entry(config);
            if (page >= 0 && page < int(page_options.size()) && select->current_option().str() != page_options[page])
              select->publish_state(size_t(page));
          }
          // Media detail rearranged for the tall screen.
          // Idle screen.
          const auto mode = id(panel_idle_screen).active_index().value_or(0);
          const bool idle_clock = standby && mode == onx_panel_ui::IDLE_CLOCK && !id(screen_off_state) && !id(sleep_mode_state);
          const bool idle_photos = standby && mode == onx_panel_ui::IDLE_IMMICHFRAME &&
                                   !id(screen_off_state) && !id(sleep_mode_state);
          onx_panel_ui::update_idle_badge(onx_notification::center.items.size(), idle_clock || idle_photos);
          if (idle_clock) {
            static bool laid_out = false;
            const bool on_page = lv_scr_act() == id(standby_page)->obj;
            std::string today;
            if (id(ha_time_ready)) { auto now = id(ha_time).now(); if (now.is_valid()) today = now.strftime("%Y-%m-%d"); }
            if (on_page)
              onx_idle_clock::update(id(standby_page)->obj, onx_panel_ui::width, onx_panel_ui::height,
                                     id(standby_weather_state), today, entered || !laid_out);
            laid_out = on_page;
            if (id(normal_ha_api_connected) && onx_idle_clock::forecast_due(id(standby_weather_entity_id), millis()))
              id(request_idle_forecast).execute(id(standby_weather_entity_id));
          }
          if (entered && mode == onx_panel_ui::IDLE_DASHBOARD && id(room_panel)->stream_status() != "not configured")
            id(room_panel)->open_dashboard();
          const bool immichframe = mode == onx_panel_ui::IDLE_IMMICHFRAME;
          const bool slideshow = standby && immichframe;
          auto *layer = onx_panel_ui::slide_layer;
          if (!slideshow) {
            if (!onx_panel_ui::hidden(layer)) {
              onx_panel_ui::show(layer, false);
              onx_panel_ui::slide_error_show(nullptr, "");
              lv_image_set_src(onx_panel_ui::slide_image, static_cast<const void *>(nullptr));
              if (!onx_panel_ui::slide_loading) {
                id(immichframe_image)->release();
              }
            }
            return;
          }
          if (onx_panel_ui::hidden(layer)) {
            onx_panel_ui::show(layer, true);
            lv_obj_move_foreground(layer);
            // The notification bell stays above the photo.
            if (onx_panel_ui::idle_badge != nullptr) lv_obj_move_foreground(onx_panel_ui::idle_badge);
            onx_panel_ui::slide_due = millis();
          }
          if (id(ha_time_ready)) {
            auto now = id(ha_time).now();
            if (now.is_valid()) onx_render::label(onx_panel_ui::slide_time, now.strftime(onx_display_settings::time_pattern()).c_str());
          }
          onx_idle_clock::photo_overlay = id(panel_photo_overlay).active_index().value_or(0);
          onx_idle_clock::update_photo_overlay(onx_panel_ui::width, onx_panel_ui::height, id(standby_weather_state));
          const bool due = !onx_panel_ui::slide_loading &&
                           static_cast<int32_t>(millis() - onx_panel_ui::slide_due) >= 0;
          const std::string url = onx_panel_ui::immichframe_photo_url(id(panel_immichframe_url).state,
                                                   onx_panel_ui::width, onx_panel_ui::height,
                                                   id(panel_immichframe_fit).active_index().value_or(0),
                                                   id(panel_immichframe_split).state, [&]() {
                                                     std::string f;
                                                     auto add = [&](bool on, const char *name) { if (on) f += (f.empty() ? "" : ",") + std::string(name); };
                                                     add(id(panel_immichframe_info_date).state, "date");
                                                     add(id(panel_immichframe_info_location).state, "location");
                                                     add(id(panel_immichframe_info_album).state, "album");
                                                     add(id(panel_immichframe_info_people).state, "people");
                                                     add(id(panel_immichframe_info_description).state, "description");
                                                     return f;
                                                   }(),
                                                   due && onx_panel_ui::slide_step < 0);
          if (url.empty()) {
            onx_render::label(onx_panel_ui::slide_hint,
                "Set the ImmichFrame address on the panel's\nweb setup (Idle screen page).");
          }
          onx_panel_ui::show(onx_panel_ui::slide_hint, url.empty());
          if (url.empty()) onx_panel_ui::slide_error_show(nullptr, "");
          if (url.empty() || !due) return;
          auto *image = id(immichframe_image);
          onx_panel_ui::slide_step = 0;
          onx_panel_ui::slide_loading = true;
          onx_panel_ui::slide_due = millis() + static_cast<uint32_t>(id(panel_slideshow_seconds).state * 1000.0f);
          id(entity_icon_downloader)->set_artwork_busy(true);
          image->set_url(url);
          image->update();
  # A new orientation changes the screen size: restart once it is saved.
  - interval: 1s
    then:
      # Recent binary-sensor changes for the redesigned detail screen.
      - lambda: |-
          if (id(ha_time_ready)) onx_panel_detail::track(id(ha_time).now().timestamp);
      - lambda: |-
          static uint32_t due = 0;
          if (onx_display_settings::orientation.turns == onx_panel_ui::turns) { due = 0; return; }
          if (due == 0) {
            due = millis() + 2000;  // Let the settings response reach the browser.
            ESP_LOGI("panel", "Orientation changed to %u deg; restarting", onx_display_settings::orientation.turns * 90);
            return;
          }
          if (millis() >= due) App.safe_reboot();
  - interval: 50ms
    then:
      - lambda: |-
          // Keep legacy widgets and overlays on the same saved background
          // palette as the rectangular cards. Runtime setters use this mapper
          // too, so periodic refreshes cannot restore a different palette.
          using Pair = onx_render::PalettePair;
          const auto &surfaces = onx_render::DARK_SURFACES;
          const auto &texts = onx_render::DARK_TEXTS;
          static const lv_style_prop_t surface_props[] = {
            LV_STYLE_BG_COLOR, LV_STYLE_BG_GRAD_COLOR, LV_STYLE_BORDER_COLOR,
            LV_STYLE_ARC_COLOR, LV_STYLE_LINE_COLOR, LV_STYLE_OUTLINE_COLOR,
          };
          static const lv_style_selector_t parts[] = {
            LV_PART_MAIN, LV_PART_INDICATOR, LV_PART_KNOB, LV_PART_ITEMS,
          };
          static lv_obj_t *previous = nullptr;
          static int8_t previous_mode = -1;
          static uint8_t ticks = 0;
          // Accent colour (formerly "ring color"): the shared packages still
          // declare the default blue (and its darker button variant) on many
          // widgets. Map those, and any accent applied earlier, to the current one.
          static std::vector<uint32_t> accents{onx_display_settings::DEFAULT_ACCENT};
          static std::vector<uint32_t> strongs{0x1F6FEB};
          static uint32_t applied_accent = onx_display_settings::DEFAULT_ACCENT;
          const uint32_t accent = onx_display_settings::accent();
          const uint32_t strong = onx_display_settings::accent_strong();
          auto *page = lv_scr_act();
          const bool enabled = true;
          onx_render::dark_palette = false;
          onx_render::panel_palette = true;
          static uint32_t applied_background = 0xFFFFFFFF;
          const bool background_changed = applied_background != onx_display_settings::background();
          if(background_changed){onx_render::remember_panel_colors();applied_background=onx_display_settings::background();}
          const bool accent_changed = accent != applied_accent;
          const bool changed = page != previous || enabled != (previous_mode == 1) || accent_changed || background_changed;
          // Re-sweep once a second to catch raw runtime style changes.
          if (!changed && !(enabled && ++ticks >= 20)) return;
          ticks = 0;
          // Never treat a palette surface/text colour as a former accent.
          auto palette = [&](uint32_t c) {
            for (const auto &p : surfaces) if (c == p.normal || c == p.dark) return true;
            for (const auto &p : texts) if (c == p.normal || c == p.dark) return true;
            return false;
          };
          auto remember = [&](std::vector<uint32_t> &list, uint32_t c) {
            if (palette(c) || std::find(list.begin(), list.end(), c) != list.end()) return;
            if (list.size() >= 8) list.erase(list.begin() + 1);  // Keep the default.
            list.push_back(c);
          };
          remember(accents, accent);
          remember(strongs, strong);
          applied_accent = accent;
          if (changed || enabled) {
            auto recolor = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) return;
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              uint32_t to;
              if (c != accent && std::find(accents.begin(), accents.end(), c) != accents.end()) to = accent;
              else if (c != strong && std::find(strongs.begin(), strongs.end(), c) != strongs.end()) to = strong;
              else return;
              v.color = lv_color_hex(to);
              lv_obj_set_local_style_prop(obj, prop, v, sel);
            };
            auto remap = [&](lv_obj_t *obj, lv_style_prop_t prop, lv_style_selector_t sel,
                             const Pair *table, size_t n, bool to_dark) {
              lv_style_value_t v;
              if (lv_obj_get_local_style_prop(obj, prop, &v, sel) != LV_STYLE_RES_FOUND) {
                if(prop!=LV_STYLE_TEXT_COLOR||sel!=LV_PART_MAIN||!lv_obj_check_type(obj,&lv_label_class))return;
                v.color=lv_obj_get_style_text_color(obj,LV_PART_MAIN);
              }
              const uint32_t c = lv_color_to_u32(v.color) & 0xFFFFFF;
              const auto to=onx_render::panel_property_color(obj,prop,c);
              if(to!=c){v.color=lv_color_hex(to);lv_obj_set_local_style_prop(obj,prop,v,sel);}
            };
            std::function<void(lv_obj_t *)> walk = [&](lv_obj_t *obj) {
              // Photo overlays (ImmichFrame) keep their fixed colours.
              if (lv_obj_has_flag(obj, onx_render::FIXED_PALETTE)) return;
              for (auto part : parts) {
                for (auto prop : surface_props)
                  remap(obj, prop, part, surfaces, sizeof(surfaces) / sizeof(*surfaces), enabled);
                remap(obj, LV_STYLE_TEXT_COLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                remap(obj, LV_STYLE_IMAGE_RECOLOR, part, texts, sizeof(texts) / sizeof(*texts), enabled);
                for (auto prop : surface_props) recolor(obj, prop, part);
                recolor(obj, LV_STYLE_TEXT_COLOR, part);
                recolor(obj, LV_STYLE_IMAGE_RECOLOR, part);
              }
              const uint32_t n = lv_obj_get_child_count(obj);
              for (uint32_t i = 0; i < n; ++i) walk(lv_obj_get_child(obj, i));
            };
            // Pages left dark are restored when they are next shown. The
            // rectangular main and detail screens keep their own palette: they
            // are rebuilt on every change, so remapping them flashed on touch.
            walk(page);
            onx_render::style_bg_color(page,lv_color_hex(onx_display_settings::background()),0);
            onx_render::style_text_color(page,lv_color_hex(onx_display_settings::foreground()),0);
            auto *top = lv_layer_top();
            for (uint32_t i = 0; i < lv_obj_get_child_count(top); ++i) {
              auto *child = lv_obj_get_child(top, i);
              if (child != onx_panel_pages::layer) walk(child);
            }
          }
          if (!changed) return;
          previous = page; previous_mode = enabled ? 1 : 0;
          // The base layout's round shells show as discs on a rectangle.
          onx_panel_ui::flatten(page);
          for (uint32_t i = 0; i < lv_obj_get_child_count(page); ++i) {
            auto *shell = lv_obj_get_child(page, i);
            if (lv_obj_check_type(shell, &lv_obj_class)) {
              // Main carousel pages use the space above the compact icon bar.
              if (onx_navigation::visible && page != id(standby_page)->obj) {
                lv_obj_set_height(shell, onx_panel_ui::height - 44);
                lv_obj_set_style_radius(shell, 0, 0);
              }
            }
          }

esphome:
  includes:
    - ../../onx_panel_ui.h
    - ../../onx_ble_guard.h
    - ../../onx_panel_layout.h
    - ../../onx_panel_artwork.h
    - ../../onx_grid_cache.h
    - ../../onx_panel_detail.h
    - ../../onx_panel_pages.h
    - ../../onx_idle_clock.h
  on_boot:
    # Orientation (Device settings → Display orientation; no accelerometer):
    # before the SPI display (HARDWARE), touchscreen and LVGL read the
    # dimensions, so landscape is a native 480x320 (or 320x240) screen.
    - priority: 1100
      then:
        - lambda: |-
            onx_render::panel_palette = true;
            onx_display_settings::BackgroundSettings background{};
            auto bg_preference=global_preferences->make_preference<onx_display_settings::BackgroundSettings>(fnv1_hash("onx.background.v1"));
            if(bg_preference.load(&background) && background.magic==0x4F4E5842 && background.color<=0xFFFFFF)
              onx_display_settings::background_settings=background;
            onx_render::remember_panel_colors();
            onx_display_settings::Orientation saved{};
            auto preference = global_preferences->make_preference<onx_display_settings::Orientation>(
                fnv1_hash("onx.orientation.v1"));
            const uint8_t turns = preference.load(&saved) && saved.magic == 0x4F4E584F && saved.turns <= 3 ? saved.turns : 0;
            onx_panel_ui::configure_screen(${display_width}, ${display_height}, turns);
            id(lcd_display)->set_boot_orientation(turns);
            // Touch reports native portrait coordinates; map them to the turned screen.
            const bool swap = turns & 1;
            id(panel_touch)->set_swap_xy(swap);
            id(panel_touch)->set_mirror_x(turns == 2 || turns == 3);
            id(panel_touch)->set_mirror_y(turns == 1 || turns == 2);
            id(panel_touch)->set_calibration(0, swap ? ${display_height} : ${display_width},
                                             0, swap ? ${display_width} : ${display_height});
            ESP_LOGI("panel", "Orientation %u deg: %dx%d", turns * 90, onx_panel_ui::width, onx_panel_ui::height);
    # After the base UI (-100) and the notification centre (-200) are built.
    - priority: -250
      then:
        - script.execute: panel_ui_setup
    # Before the base boot handler (-100) renders any page.
    - priority: 800
      then:
        - lambda: |-
            onx_geom::scale = ${ui_scale};
            onx_navigation::shortcut_action = []() {
              if (id(touch_input)->suppress_click() || onx_notification_ui::owns_screen()) return;
              id(ui_presenter)->notify_user_activity();
              id(room_panel)->open_dashboard();
            };
            onx_navigation::local_action = [](const std::string &entity) {
              if (entity == "[Local] Dashboard") { id(room_panel)->open_dashboard(); return true; }
              if (entity == "[Local] Assist") { onx_assist::toggle(); return true; }
              return false;
            };
            onx_navigation::local_state = [](int io) {
              if (io == custom_logic::PANEL_LOCAL_DASHBOARD) return id(room_panel)->dashboard_open();
              if (io == custom_logic::PANEL_LOCAL_ASSIST) return onx_assist::running();
              return false;
            };
            onx_navigation::local_icon = [](const std::string &entity) -> esphome::image::Image * {
              if (entity == "[Local] Dashboard") return id(panel_dashboard_icon);
              if (entity == "[Local] Assist") return id(panel_assist_icon);
              return nullptr;
            };
            // The strip keeps its distance from the bottom edge in either orientation.
            const int h = onx_panel_ui::height;
            onx_navigation::configure_strip(onx_panel_ui::width, h, h - (${display_height} - ${strip_center_y}),
                                            ${strip_spacing}, ${strip_marker}, ${strip_icon},
                                            ${strip_label_y} < 0 ? -1 : h - (${display_height} - ${strip_label_y}),
                                            id(${strip_label_font})->get_lv_font());

# Icons for the panel-local controls (Material Design Icons, as the panel's fallbacks).
image:
  # The lyrics backdrop made by the Room Companion integration (onx_panel_detail::adopt_backdrop).
  - platform: online_image
    id: lyrics_backdrop_image
    url: http://homeassistant.local:8123/
    format: JPEG
    type: RGB565
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            onx_panel_detail::adopt_backdrop(onx_media::backdrop_requested, id(lyrics_backdrop_image)->get_lv_image_dsc());
            // Copied; freed on the next interval, after OnlineImage's cleanup.
            onx_media::backdrop_release = true;
    on_error:
      then:
        - lambda: |-
            if (onx_companion::owns(onx_media::backdrop_requested)) onx_companion::fail();
            onx_media::backdrop_release = true;
  - platform: online_image
    id: immichframe_image
    url: http://homeassistant.local:8123/
    format: JPEG
    type: RGB565
    update_interval: never
    request_headers:
      Authorization: "${immichframe_authorization}"
    on_download_finished:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            auto *image = id(immichframe_image);
            if (onx_panel_ui::hidden(onx_panel_ui::slide_layer)) { image->release(); return; }
            onx_panel_ui::slide_failures = 0;
            lv_image_set_src(onx_panel_ui::slide_image, image->get_lv_image_dsc());
            lv_obj_center(onx_panel_ui::slide_image);
            onx_panel_ui::slide_error_show(nullptr, "");
            onx_panel_ui::slide_fade_in(id(panel_slideshow_fade).state);
            {
              const int32_t left = static_cast<int32_t>(onx_panel_ui::slide_due - millis());
              onx_panel_ui::slide_progress_start(left > 0 ? uint32_t(left) : 1);
            }
    on_error:
      then:
        - lambda: |-
            onx_panel_ui::slide_loading = false;
            id(entity_icon_downloader)->set_artwork_busy(onx_media::downloading);
            auto *image = id(immichframe_image);
            if (onx_panel_ui::hidden(onx_panel_ui::slide_layer)) image->release();
            onx_panel_ui::slide_waiting(false);
            onx_panel_ui::slide_progress_stop();
            lv_obj_set_style_image_opa(onx_panel_ui::slide_image, LV_OPA_COVER, 0);
            if (image->get_width() == 0) lv_image_set_src(onx_panel_ui::slide_image, static_cast<const void *>(nullptr));
            const auto &err0 = image->last_error();
            // Busy downloader/worker states are not server problems: retry soon, silently.
            if (err0.rfind("Waiting for", 0) == 0 || err0.rfind("Previous artwork", 0) == 0) {
              onx_panel_ui::slide_due = millis() + 1000;
              return;
            }
            // One failure (often a slow first photo) retries after 3 s without the card.
            if (++onx_panel_ui::slide_failures < 2) {
              onx_panel_ui::slide_due = millis() + 3000;
              return;
            }
            {
              // Tell the user why photos stopped; the card clears on the next photo.
              const auto &err = image->last_error();
              std::string reason = "Can't get a photo from the ImmichFrame server. Retrying in 15 s.";
              if (err.find("401") != std::string::npos || err.find("403") != std::string::npos)
                reason = "The server refused the request. Check the ImmichFrame authorization.";
              if (!err.empty()) reason += "\n" + err.substr(0, 80);
              onx_panel_ui::slide_error_show("ImmichFrame", reason);
            }
            onx_panel_ui::slide_due = millis() + 15000;
  - platform: file
    file: "../../assets/entity_icons/monitor-dashboard.svg"
    id: panel_dashboard_icon
    resize: ${ (80 * (ui_scale | float)) | round | int }x${ (80 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  # Vacuum locate and spot clean: the MDI glyphs the web preview draws.
  - platform: file
    file: "../../assets/panel/crosshairs-gps.svg"
    id: panel_locate_icon
    resize: ${ (34 * (ui_scale | float)) | round | int }x${ (34 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/panel/autorenew.svg"
    id: panel_spot_icon
    resize: ${ (34 * (ui_scale | float)) | round | int }x${ (34 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/panel/cog-outline.svg"
    id: panel_settings_icon
    resize: ${ (72 * (ui_scale | float)) | round | int }x${ (72 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/panel/action-grid.svg"
    id: panel_action_grid_icon
    resize: 80x80
    type: RGB565
    transparency: alpha_channel
  # Light detail colour wheel (hue around, saturation outwards), from
  # OpenHAPanel (Apache-2.0, see THIRD_PARTY_NOTICES.md).
  - platform: file
    file: "../../assets/panel/color-wheel-openhapanel.png"
    id: panel_color_wheel
    resize: ${ (220 * (ui_scale | float)) | round | int }x${ (220 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "../../assets/entity_icons/microphone.svg"
    id: panel_assist_icon
    resize: ${ (80 * (ui_scale | float)) | round | int }x${ (80 * (ui_scale | float)) | round | int }
    type: RGB565
    transparency: alpha_channel

script:
  # Wake the panel and show a configured entity (configuration slot): its page,
  # or its detail screen. Closes the Assist overlay when Assist asked for it.
  - id: panel_show_entity
    parameters:
      config: int
      detail: bool
    then:
      - lambda: |-
          if (onx_power::sleeping && id(low_power_sleep).state) id(low_power_sleep).turn_off();
          if (id(ui_presenter)->is_standby_active()) id(exit_standby_mode).execute();
          id(ui_presenter)->notify_user_activity();
          if (id(normal_device_detail_active)) id(exit_normal_switch_detail).execute();
          id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
          if (detail) id(enter_normal_switch_detail).execute();
          else id(show_normal_device_entry_page).execute(0);
          onx_assist::dismiss();
  # A player's screen opened mid-song without lyrics: the Room Companion
  # integration answers with set_lyrics (onx_lyrics::request).
  - id: request_lyrics
    mode: queued
    max_runs: 2
    parameters:
      entity: string
    then:
      - homeassistant.event:
          event: esphome.room_companion_lyrics
          data:
            entity_id: !lambda return entity;
  # Daily forecast for the idle clock (onx_idle_clock.h), separate from the
  # weather page's own request so the idle weather entity needs no page.
  - id: request_idle_forecast
    mode: queued
    max_runs: 2
    parameters:
      entity: string
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: !lambda return entity;
            type: daily
          capture_response: true
          response_template: !lambda |-
            return "{% set ns = namespace(days=[]) %}{% for f in response.get('" + entity + "', {}).get('forecast', [])[:6] %}{% set ns.days = ns.days + [dict(date=f.get('datetime',''), condition=f.get('condition',''), high=f.get('temperature'), low=f.get('templow'), rain=f.get('precipitation_probability'))] %}{% endfor %}{{ dict(days=ns.days) }}";
          on_success:
            - lambda: |-
                if (entity != onx_idle_clock::forecast_entity) return;
                auto number = [](JsonVariantConst v) -> std::string {
                  if (v.isNull() || (!v.is<float>() && !v.is<int>())) return "";
                  return onx_detail_view::compact(std::to_string(v.as<float>()));
                };
                int n = 0;
                for (JsonObjectConst day : response["response"]["days"].as<JsonArrayConst>()) {
                  if (n >= int(onx_idle_clock::days.size())) break;
                  auto &f = onx_idle_clock::days[n++];
                  f.date = std::string(day["date"] | "").substr(0, 32);
                  f.condition = std::string(day["condition"] | "").substr(0, 40);
                  f.high = number(day["high"]); f.low = number(day["low"]); f.rain = number(day["rain"]);
                }
                onx_idle_clock::day_count = n;
                onx_idle_clock::forecast_received(entity);
          on_error:
            - lambda: |-
                ESP_LOGW("idle_clock", "Forecast for %s failed: %s", entity.c_str(), error.c_str());
                onx_idle_clock::forecast_failed(entity);
  - id: panel_ui_setup
    then:
      - lambda: |-
          id(lcd_display)->enable_lvgl_pipeline(id(lvgl_ui)->get_disp());
          onx_panel_pages::setup(id(fonts_MiSans_Medium_14)->get_lv_font(),
              id(fonts_MiSans_Medium_24)->get_lv_font(), id(fonts_MiSans_Medium_32)->get_lv_font());
          onx_panel_detail::unbind_icon = [](lv_obj_t *widget) { id(entity_icon_downloader)->unbind(widget); };
          onx_panel_pages::view_for = [](const std::string &entity,bool detail) {
            auto title = custom_logic::ha_entity_title_from_registry_cache(entity);
            auto view = detail ? onx_detail_view::build(entity,title) : onx_detail_view::carousel(entity,title);
            const int config = onx_panel_pages::configured(entity);
            const int ui = custom_logic::normal_ui_slot_for_device_config_slot(config);
            if (detail && config >= 0) {
              if (entity.rfind("light.",0)==0)
                view = onx_detail_view::light_view(entity,title,id(app_storage)->normal_device_slot(ui).light(),id(normal_detail_light_mode));
              else onx_entity_config::customize_control_view(ui,entity,view);
            }
            if (detail && custom_logic_entity_sub::is_timer_detail(entity)) view=onx_panel_pages::timer_view(entity,title);
            return view;
          };
          // Redesigned detail screens (onx_panel_detail.h).
          // Board fonts are scaled by font_scale while the detail layout scales
          // by P(); these sizes keep text in proportion on both panels.
          // Theme every page before LVGL can display its first frame.
          for(auto *screen:{id(device_empty)->obj,id(normal_panel_page)->obj,id(normal_detail_page)->obj,id(normal_settings_page)->obj,id(normal_settings_wifi_page)->obj,id(normal_settings_brightness_page)->obj,id(normal_settings_input_page)->obj,id(normal_settings_connection_page)->obj,id(standby_page)->obj,id(normal_provisioning_page)->obj,id(normal_add_hmi_page)->obj,id(normal_setup_help_page)->obj})
            onx_render::register_panel_screen(screen);
          onx_panel_detail::fonts = {id(fonts_MiSans_Medium_12)->get_lv_font(), id(fonts_MiSans_Medium_15)->get_lv_font(),
              id(fonts_MiSans_Bold_18)->get_lv_font(), id(fonts_MiSans_Medium_32)->get_lv_font(), &lv_font_${symbol_font},
              id(fonts_MiSans_Medium_64)->get_lv_font(), id(fonts_MiSans_Medium_12)->get_lv_font(),
              id(fonts_MiSans_Bold_14)->get_lv_font()};
          // Characters these fonts lack come from Room Companion (onx_glyphs.h). Detail
          // labels set their font directly, so attach the fallback to every one here.
          for (const lv_font_t *f : {onx_panel_detail::fonts.small, onx_panel_detail::fonts.body, onx_panel_detail::fonts.title,
                                     onx_panel_detail::fonts.big, onx_panel_detail::fonts.hero, onx_panel_detail::fonts.header_clock})
            onx_glyphs::attach(f);
          onx_controls::main_control_visible = [](const std::string &entity) {
            if (!onx_panel_pages::showing || onx_panel_pages::detail_view ||
                onx_notification::current.visible || onx_notification_ui::owns_screen() ||
                onx_panel_detail::timers.overlay || onx_assist::overlay_visible()) return false;
            for (int i = 0; i < onx_panel_pages::count; ++i)
              if (onx_panel_pages::entities[i] == entity && onx_panel_pages::configured(entity) >= 0) return true;
            return false;
          };
          onx_panel_detail::timer_interaction_pending = []() { return id(touch_input)->interaction_pending(); };
          onx_controls::overlay_control_visible = [](const std::string &entity) {
            if (!onx_panel_detail::active || !onx_panel_detail::timer_screen_active ||
                !onx_panel_detail::root || !lv_obj_is_visible(onx_panel_detail::root) ||
                onx_notification_ui::owns_screen() || onx_assist::overlay_visible()) return false;
            for (const auto &t : onx_panel_detail::all_timers())
              if (t.helper && t.entity == entity) return true;
            return false;
          };
          onx_panel_detail::blocked = []() {
            return id(touch_input)->suppress_click() || onx_notification_ui::owns_screen();
          };
          onx_panel_detail::activity = []() { id(touch_input)->acknowledge_click(); id(ui_presenter)->notify_user_activity(); };
          onx_panel_detail::light_state = [](const std::string &entity) {
            const int config = onx_panel_pages::configured(entity);
            if (config < 0) return esphome::onx_storage::NormalLightState{};
            return id(app_storage)->normal_device_slot(custom_logic::normal_ui_slot_for_device_config_slot(config)).light();
          };
          onx_panel_detail::light_mode = []() { return int(id(normal_detail_light_mode)); };
          onx_panel_detail::light_wheel = id(panel_color_wheel)->get_lv_image_dsc();
          onx_panel_detail::light_mode_icons = {id(normal_light_mode_icon_bright_img)->get_lv_image_dsc(),
              id(normal_light_mode_icon_cct_img)->get_lv_image_dsc(), id(normal_light_mode_icon_color_img)->get_lv_image_dsc()};
          onx_panel_detail::settings_icon = id(panel_settings_icon)->get_lv_image_dsc();
          onx_panel_detail::symbol_images = {{LV_SYMBOL_GPS, id(panel_locate_icon)->get_lv_image_dsc()},
                                             {LV_SYMBOL_LOOP, id(panel_spot_icon)->get_lv_image_dsc()}};
          onx_panel_ui::create_idle_badge(id(standby_page)->obj, id(fonts_MiSans_Medium_14)->get_lv_font(),
              id(panel_bell_icon)->get_lv_image_dsc());
          // Idle clock layout (onx_idle_clock.h) over the shared standby widgets.
          {
            auto &b = onx_idle_clock::base;
            // One set of status icons (top layer) serves the carousel and the idle clock.
            b.wifi_on = id(normal_device_wifi_online_widget); b.wifi_off = id(normal_device_wifi_offline_widget);
            b.ha_on = id(normal_device_homeassistant_online_widget); b.ha_off = id(normal_device_homeassistant_offline_widget);
            b.weather_icons = {id(standby_weather_unknown_widget), id(standby_weather_clear_night_widget),
                id(standby_weather_cloudy_widget), id(standby_weather_exceptional_widget), id(standby_weather_fog_widget),
                id(standby_weather_hail_widget), id(standby_weather_lightning_widget), id(standby_weather_lightning_rainy_widget),
                id(standby_weather_partlycloudy_widget), id(standby_weather_pouring_widget), id(standby_weather_rainy_widget),
                id(standby_weather_snowy_widget), id(standby_weather_snowy_rainy_widget), id(standby_weather_sunny_widget),
                id(standby_weather_windy_widget), id(standby_weather_windy_variant_widget)};
            b.temp_icon = id(standby_temperature_icon_widget); b.temp = id(standby_temperature_widget);
            b.humidity_icon = id(standby_humidity_icon_widget); b.humidity = id(standby_humidity_widget);
            b.date = id(standby_date_widget); b.time = id(standby_time_widget);
            onx_idle_clock::fonts = {id(fonts_MiSans_Medium_12)->get_lv_font(), id(fonts_MiSans_Medium_14)->get_lv_font(),
                id(fonts_MiSans_Medium_16)->get_lv_font(), id(fonts_MiSans_Medium_24)->get_lv_font(),
                id(fonts_MiSans_Bold_64)->get_lv_font(), id(panel_clock_big_font)->get_lv_font(),
                id(fonts_MiSans_Medium_32)->get_lv_font(), id(fonts_MiSans_Medium_20)->get_lv_font(),
                id(fonts_MiSans_Medium_24)->get_lv_font()};
            onx_idle_clock::condition_image = [](const std::string &c) -> const void * {
              if (c == "clear-night") return id(standby_weather_icon_clear_night_img)->get_lv_image_dsc();
              if (c == "cloudy") return id(standby_weather_icon_cloudy_img)->get_lv_image_dsc();
              if (c == "exceptional") return id(standby_weather_icon_exceptional_img)->get_lv_image_dsc();
              if (c == "fog") return id(standby_weather_icon_fog_img)->get_lv_image_dsc();
              if (c == "hail") return id(standby_weather_icon_hail_img)->get_lv_image_dsc();
              if (c == "lightning") return id(standby_weather_icon_lightning_img)->get_lv_image_dsc();
              if (c == "lightning-rainy") return id(standby_weather_icon_lightning_rainy_img)->get_lv_image_dsc();
              if (c == "partlycloudy") return id(standby_weather_icon_partlycloudy_img)->get_lv_image_dsc();
              if (c == "pouring") return id(standby_weather_icon_pouring_img)->get_lv_image_dsc();
              if (c == "rainy") return id(standby_weather_icon_rainy_img)->get_lv_image_dsc();
              if (c == "snowy") return id(standby_weather_icon_snowy_img)->get_lv_image_dsc();
              if (c == "snowy-rainy") return id(standby_weather_icon_snowy_rainy_img)->get_lv_image_dsc();
              if (c == "sunny") return id(standby_weather_icon_sunny_img)->get_lv_image_dsc();
              if (c == "windy") return id(standby_weather_icon_windy_img)->get_lv_image_dsc();
              if (c == "windy-variant") return id(standby_weather_icon_windy_variant_img)->get_lv_image_dsc();
              return id(standby_weather_icon_unknown_img)->get_lv_image_dsc();
            };
          }
          // Elapsed / total time on the media detail.
          onx_panel_ui::time_font = id(fonts_MiSans_Medium_12)->get_lv_font();
          onx_panel_ui::media_duration = []() -> float {
            const auto *d = custom_logic_entity_sub::entity_detail(
                id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index)));
            return d != nullptr ? d->progress.duration : NAN;
          };
          onx_panel_detail::set_light_mode = [](int mode) { id(normal_detail_light_mode) = mode; };
          onx_panel_pages::draw_graph = [](lv_obj_t *parent,const std::string &entity,int y) {
            static std::string previous;
            static uint32_t refreshed = 0;
            onx_sensor_graph::panel_owned = true;
            if (previous != entity || millis() - refreshed >= 1000 || !onx_sensor_graph::canvas) {
              onx_sensor_graph::render(parent,entity,id(ha_time).now().timestamp,
                  onx_display_settings::current.media_color,id(fonts_MiSans_Medium_12)->get_lv_font(),
                  entity.rfind("sensor.",0)==0 && parent!=onx_panel_detail::root ? lv_obj_get_style_width(parent,LV_PART_MAIN)-onx_panel_detail::P(24) : 0,
                  entity.rfind("sensor.",0)==0 && parent!=onx_panel_detail::root ? lv_obj_get_style_height(parent,LV_PART_MAIN)-onx_panel_detail::P(40) : 0);
              previous = entity; refreshed = millis();
            }
            if (onx_sensor_graph::canvas) {
              lv_obj_remove_flag(onx_sensor_graph::canvas,LV_OBJ_FLAG_HIDDEN);
              if (lv_obj_get_parent(onx_sensor_graph::canvas)!=parent) lv_obj_set_parent(onx_sensor_graph::canvas,parent);
              onx_render::align(onx_sensor_graph::canvas,LV_ALIGN_TOP_MID,0,y);
            }
          };
          onx_panel_detail::draw_graph = onx_panel_pages::draw_graph;
          // Timer slots, listed below the focused timer on the timer screen.
          onx_panel_detail::timer_entities = []() {
            std::vector<std::string> out;
            for (int i = 0; i < id(normal_device_count) && i < (int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT; ++i) {
              const auto entity = id(ui_presenter)->get_normal_device_entity_id(i);
              if (custom_logic_entity_sub::is_timer_detail(entity)) out.push_back(entity);
            }
            return out;
          };
          onx_panel_detail::shortcut = [](const std::string &entity) {
            const int config = onx_panel_pages::configured(entity);
            return config < 0 ? std::string() : onx_entity_config::action_for_slot(config);
          };
          onx_panel_detail::shortcut_title = [](const std::string &action) {
            return onx_media::display_text(custom_logic::ha_entity_title_from_registry_cache(action));
          };
          onx_media::detach_main_artwork = []() { onx_panel_detail::detach_artwork(); };
          onx_media::map_camera = [](const std::string &entity) {
            const int i = onx_sensor_view::index(entity);
            return i >= 0 ? std::string(onx_sensor_view::configs[i].secondary) : std::string();
          };
          // Read the integration's asset URL here: the icon and glyph workers cannot read NVS.
          onx_companion::ensure_loaded();
          // Camera previews from Room Companion, sized to the camera frame.
          onx_media::camera_box = static_cast<int>(320 * ${ui_scale} + 0.5f);
          onx_media::camera_live = []() { return id(room_panel)->stream_settings().camera_source == "companion"; };
          onx_media::refresh_diagnostics = []() {
            std::string g;
            auto flag = [&g](const char *name, bool on) { if (on) { if (!g.empty()) g += ','; g += name; } };
            flag("downloading", onx_media::downloading);
            flag("streaming", id(media_cover_image)->is_streaming());
            flag("busy", id(media_cover_image)->is_busy());
            flag("api_down", !id(normal_ha_api_connected));
            flag("screen_off", id(screen_off_state));
            flag("sleep", id(sleep_mode_state));
            flag("standby", id(ui_presenter)->is_standby_active());
            flag("detail", id(normal_device_detail_active));
            flag("detail_ui", onx_panel_detail::active);
            flag("main_mode", onx_panel_detail::main_mode);
            flag("icons_busy", id(entity_icon_downloader)->busy());
            flag("backdrop_busy", onx_media::backdrop_busy());
            flag("memory_wait", !id(media_cover_image)->memory_ready());
            return g;
          };
          onx_lyrics::request_hook = [](const std::string &entity) {
            if (!id(normal_ha_api_connected)) return false;
            id(request_lyrics)->execute(entity);
            return true;
          };
          onx_media::backdrop_busy_hook = []() { return id(lyrics_backdrop_image)->is_busy(); };
          onx_panel_detail::backdrop_url = [](const std::string &entity, int w, int h) -> std::string {
            const auto *d = custom_logic_entity_sub::entity_detail(entity);
            return d == nullptr ? std::string() : onx_companion::cover_url(entity, d->picture, w, h, "&mode=blur&q=80");
          };
          onx_panel_detail::artwork_source = [](const std::string &entity) -> const void * {
            const auto *d = custom_logic_entity_sub::entity_detail(entity);
            const auto art = onx_media::art_entity(entity);
            const bool cam = onx_media::snapshot_entity(art);
            if (!d || !d->available || (!cam && !onx_media::has_playback(d->state))) return nullptr;
            const std::string pic = onx_media::art_picture(entity, art, d->picture);
            auto origin = custom_logic::build_ha_http_state_url(id(ha_host).state, "media_player.cover");
            const auto path = origin.find("/api/states/");
            if (path != std::string::npos) origin.resize(path);
            const auto base = cam ? onx_media::camera_picture_url(origin, art, pic)
                                  : onx_media::media_art_url(origin, entity, d->picture, static_cast<int>(240 * ${ui_scale} + 0.5f));
            const auto stream = cam && art == entity ? onx_media::camera_stream_url(origin, entity, d->picture) : std::string();
            if (cam && base.empty()) {
              static std::string logged_picture = "\x01";
              if (d->picture != logged_picture) {
                logged_picture = d->picture;
                ESP_LOGI("camera", "%s has no usable entity_picture: '%.60s'", entity.c_str(), d->picture.c_str());
              }
            }
            if (base.empty() || onx_media::ready_url.empty()) return nullptr;
            if (onx_media::ready_url == base || (cam && (onx_media::ready_url.rfind(base, 0) == 0 || (!stream.empty() && onx_media::ready_url == stream))))
              return id(media_cover_image)->get_lv_image_dsc();
            // Diagnostics: why a downloaded camera snapshot is not shown (logged once per URL pair).
            if (cam) {
              static std::string logged;
              const auto key = base + '|' + onx_media::ready_url;
              if (key != logged) {
                logged = key;
                ESP_LOGI("camera", "%s snapshot not matched: picture=%.60s ready=%.60s", entity.c_str(), base.c_str(), onx_media::ready_url.c_str());
              }
            }
            return nullptr;
          };
          // Live camera view: go2rtc rendered by the dashboard stream's server
          // into an offscreen buffer, shown over the camera detail's snapshot.
          onx_panel_detail::live_camera = [](const std::string &entity, int x, int y, int w, int h) {
            return id(room_panel)->camera_view(entity, x, y, w, h);
          };
          onx_panel_detail::live_camera_frame = []() { return id(room_panel)->camera_frame(); };
          onx_panel_detail::live_audio = [](const std::string &entity) { return id(room_panel)->camera_audio(entity); };
          onx_panel_detail::toggle_live_audio = [](const std::string &entity) { id(room_panel)->toggle_camera_audio(entity); };
          onx_panel_detail::live_camera_fullscreen = [](bool on) { id(room_panel)->set_camera_fullscreen(on); };
          onx_panel_detail::reload_live_camera = []() { id(room_panel)->reload_camera(); };
          id(room_panel)->set_camera_fullscreen_exit([]() { onx_panel_detail::exit_live_fullscreen(); });
          id(room_panel)->set_camera_frame_callback([](const lv_image_dsc_t *frame) {
            onx_panel_detail::show_live_frame(frame);
          });
          id(room_panel)->set_ha_origin([]() {
            auto origin = custom_logic::build_ha_http_state_url(id(ha_host).state, "camera.live");
            const auto path = origin.find("/api/states/");
            if (path != std::string::npos) origin.resize(path);
            return origin;
          });
          // WebRTC Camera integration: webrtc.create_link registers a link its
          // embed page plays without sign-in (no open or time limit; the
          // panel registers it again on every open).
          id(room_panel)->set_webrtc_link_action([](const std::string &link, const std::string &entity, const std::string &url) {
            #ifdef USE_API_HOMEASSISTANT_SERVICES
            if (!id(normal_ha_api_connected) || link.empty() || (entity.empty() && url.empty())) return false;
            esphome::api::HomeassistantActionRequest call;
            static constexpr char svc[] = "webrtc.create_link";
            static constexpr char k_link[] = "link_id";
            static constexpr char k_entity[] = "entity";
            static constexpr char k_url[] = "url";
            static constexpr char k_limit[] = "open_limit";
            static constexpr char k_ttl[] = "time_to_live";
            static constexpr char zero[] = "0";
            call.service = {svc, sizeof(svc) - 1};
            call.data.init(4);
            auto add = [&](const char *k, size_t kl, const char *v, size_t vl) {
              esphome::api::HomeassistantServiceMap item;
              item.key = {k, kl};
              item.value = {v, vl};
              call.data.push_back(item);
            };
            add(k_link, sizeof(k_link) - 1, link.data(), link.size());
            if (!entity.empty()) add(k_entity, sizeof(k_entity) - 1, entity.data(), entity.size());
            else add(k_url, sizeof(k_url) - 1, url.data(), url.size());
            add(k_limit, sizeof(k_limit) - 1, zero, 1);
            add(k_ttl, sizeof(k_ttl) - 1, zero, 1);
            id(api_server)->send_homeassistant_action(call);
            ESP_LOGI("camera", "webrtc.create_link for %s", entity.empty() ? "a stream address" : entity.c_str());
            return true;
            #else
            return false;
            #endif
          });
          id(room_panel)->set_camera_visible([]() {
            auto *image = onx_panel_detail::live_image;
            return image != nullptr && onx_panel_detail::active && !onx_panel_detail::main_mode &&
                   id(normal_device_detail_active) && lv_obj_is_visible(lv_obj_get_parent(image)) &&
                   !id(screen_off_state) && !id(sleep_mode_state) && !id(ui_presenter)->is_standby_active();
          });
          onx_panel_detail::refresh_camera = []() {
            if (id(media_cover_image)->is_streaming()) {
              if (onx_media::detach_main_artwork) onx_media::detach_main_artwork();
              id(media_cover_image)->release();
              onx_media::downloading = false;
              onx_media::ready_url.clear();
              onx_media::requested_url.clear();
              id(entity_icon_downloader)->set_artwork_busy(false);
            }
            ++onx_media::camera_refresh_seq;
            onx_media::artwork_refresh_pending = true;
          };
          onx_panel_detail::send_ptz = [](const std::string &entity, const std::string &param, const std::string &dir) {
            #ifdef USE_API_HOMEASSISTANT_SERVICES
            if (!id(normal_ha_api_connected) || entity.empty() || param.empty() || dir.empty()) return;
            esphome::api::HomeassistantActionRequest call;
            static constexpr char svc[] = "onvif.ptz";
            static constexpr char k_entity[] = "entity_id";
            static constexpr char k_mode[] = "move_mode";
            static constexpr char v_mode[] = "ContinuousMove";
            static constexpr char k_dist[] = "distance";
            static constexpr char v_dist[] = "0.2";
            call.service = {svc, sizeof(svc) - 1};
            call.data.init(4);
            auto add = [&](const char *k, size_t kl, const char *v, size_t vl) {
              esphome::api::HomeassistantServiceMap item;
              item.key = {k, kl};
              item.value = {v, vl};
              call.data.push_back(item);
            };
            add(k_entity, sizeof(k_entity) - 1, entity.data(), entity.size());
            add(param.data(), param.size(), dir.data(), dir.size());
            add(k_mode, sizeof(k_mode) - 1, v_mode, sizeof(v_mode) - 1);
            add(k_dist, sizeof(k_dist) - 1, v_dist, sizeof(v_dist) - 1);
            id(api_server)->send_homeassistant_action(call);
            #endif
          };
          // Vacuum room cleaning: Home Assistant's vacuum.clean_area with area ids,
          // or the user's script with the room names (docs/room-companion/vacuum-rooms.md).
          onx_panel_detail::vacuum_rooms = [](const std::string &entity) { return onx_entity_config::vacuum_rooms_for(entity); };
          onx_panel_detail::clean_rooms = [](const std::string &entity, const onx_vacuum_rooms::Config &cfg, const std::vector<int> &order) {
            #ifdef USE_API_HOMEASSISTANT_SERVICES
            if (!id(normal_ha_api_connected) || order.empty()) return false;
            std::string ids, names, list;
            for (int i : order) {
              if (i < 0 || i >= cfg.count) return false;
              const auto &room = cfg.rooms[i];
              if (!names.empty()) { names += cfg.separator; ids += cfg.separator; list += ", "; }
              names += room.name; ids += room.id; list += std::string("'") + room.id + "'";
            }
            list = "[" + list + "]";
            const bool areas = cfg.method == onx_vacuum_rooms::AREAS;
            const std::string service = areas ? "vacuum.clean_area" : std::string(cfg.script);
            if (service.empty()) return false;
            esphome::api::HomeassistantActionRequest call;
            call.service = {service.data(), service.size()};
            static constexpr char k_entity[] = "entity_id", k_area[] = "cleaning_area_id", k_vacuum[] = "vacuum_entity", k_ids[] = "room_ids";
            auto item = [](const char *k, size_t kl, const std::string &v) {
              esphome::api::HomeassistantServiceMap m;
              m.key = {k, kl};
              m.value = {v.data(), v.size()};
              return m;
            };
            const bool any_id = std::any_of(order.begin(), order.end(), [&](int i) { return cfg.rooms[i].id[0] != 0; });
            if (areas) {
              call.data.init(1);
              call.data.push_back(item(k_entity, sizeof(k_entity) - 1, entity));
              // A list renders from a template (plain data would arrive as a string).
              call.data_template.init(1);
              call.data_template.push_back(item(k_area, sizeof(k_area) - 1, list));
            } else {
              const std::string field = cfg.field;
              call.data.init(any_id ? 3 : 2);
              call.data.push_back(item(field.data(), field.size(), names));
              call.data.push_back(item(k_vacuum, sizeof(k_vacuum) - 1, entity));
              if (any_id) call.data.push_back(item(k_ids, sizeof(k_ids) - 1, ids));
              id(api_server)->send_homeassistant_action(call);
              ESP_LOGI("vacuum", "Rooms sent to %s: %s", service.c_str(), names.c_str());
              return true;
            }
            id(api_server)->send_homeassistant_action(call);
            ESP_LOGI("vacuum", "vacuum.clean_area %s: %s", entity.c_str(), list.c_str());
            return true;
            #else
            return false;
            #endif
          };
          onx_panel_detail::quick_actions = [](const std::string &entity) {
            const int config = onx_panel_pages::configured(entity);
            return config < 0 ? nullptr : onx_entity_config::playlists_for_ui(custom_logic::normal_ui_slot_for_device_config_slot(config), entity);
          };
          onx_panel_detail::run_quick_action = [](const std::string &action) { id(emit_normal_playlist_action).execute(action); };
          onx_panel_detail::request_history = [](const std::string &entity) { id(request_normal_sensor_history).execute(entity); };
          onx_panel_detail::request_hourly = [](const std::string &entity) { id(request_normal_weather_hourly).execute(entity); };
          onx_subs::shown = [](const std::string &entity) {
            // Entities on the current page, the second entity a card shows
            // (sensor text, a switch's power reading) and the main player.
            for (int i = 0; i < onx_panel_pages::count; ++i) {
              const auto &e = onx_panel_pages::entities[i];
              if (e == entity) return true;
              const int s = onx_sensor_view::index(e);
              if (s >= 0 && entity == onx_sensor_view::configs[s].secondary) return true;
            }
            return entity == onx_media::main_entity;
          };
          onx_panel_ui::has_quick_actions = []() {
            const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
            return onx_entity_config::playlists_for_ui(id(normal_device_detail_index), entity) != nullptr;
          };
          onx_panel_ui::open_quick_actions = []() {
            if (id(touch_input)->suppress_click()) return;
            const auto entity = id(ui_presenter)->get_normal_device_entity_id(id(normal_device_detail_index));
            onx_playlist::browser.toggle(entity);
            id(refresh_normal_playlist).execute();
          };
          onx_panel_detail::run_shortcut = []() { id(emit_configured_press_action).execute(id(normal_device_detail_index)); };
          onx_panel_pages::open = [](const std::string &entity) {
            if (id(touch_input)->suppress_click() || onx_notification::current.visible ||
                onx_timer::popup.visible || onx_notification_ui::owns_screen() ||
                id(ui_presenter)->is_standby_active()) return;
            const int config = onx_panel_pages::configured(entity);
            if (config < 0) return;
            id(normal_device_selected_index) = custom_logic::normal_ui_slot_for_device_config_slot(config);
            id(ui_presenter)->notify_user_activity();
            id(enter_normal_switch_detail).execute();
          };
          onx_panel_pages::run_grid_action = [](const std::string &entity) {
            if (id(touch_input)->suppress_click() || onx_notification::current.visible ||
                onx_timer::popup.visible || onx_notification_ui::owns_screen() ||
                id(ui_presenter)->is_standby_active()) return;
            id(ui_presenter)->notify_user_activity();
            const int config = onx_panel_pages::configured(entity);
            if (config < 0) return;
            const int ui = custom_logic::normal_ui_slot_for_device_config_slot(config);
            if (!onx_entity_config::action_for_ui(ui).empty()) {
              id(emit_configured_press_action).execute(ui);
              return;
            }
            const auto domain = entity.substr(0, entity.find('.'));
            const auto *d = custom_logic_entity_sub::entity_detail(entity);
            if (!d || !d->available) return;
            if (domain == "scene" || domain == "button" || domain == "input_button" || domain == "media_player" || domain == "vacuum") {
              onx_controls::press(entity);
            } else if (domain == "lock") {
              if (!d->code_format.empty() && d->code_format != "None") {
                if (onx_panel_pages::open) onx_panel_pages::open(entity);
              } else {
                onx_controls::press(entity);
              }
            } else if (domain == "camera" || domain == "alarm_control_panel") {
              if (onx_panel_pages::open) onx_panel_pages::open(entity);
            } else if (domain == "script" || domain == "automation") {
              const auto service = domain == "script" ? "script.turn_on" : "automation.trigger";
              onx_panel_detail::request(entity, service, "", "on", "panel_run");
            } else if (domain == "switch" || domain == "input_boolean" || domain == "light" || domain == "fan" || domain == "siren") {
              const auto state = onx_controls::effective(*d, "state");
              onx_panel_detail::request(entity, domain + ".toggle", "", state == "on" ? "off" : "on", "panel_power");
            }
          };
          id(touch_input)->set_tap_fn([](int x,int y) { return onx_panel_pages::tap(x,y); });
          id(touch_input)->set_hold_fn([](int x,int y) { return onx_panel_pages::tap(x,y,true); });
          // Touch-down feedback on main-page cards.
          id(touch_input)->set_press_fn([](int x, int y, bool pressed) { onx_panel_detail::press_at(x, y, pressed); });
          // Runtime geometry (orientation chosen at boot).
          id(touch_input)->set_geometry(onx_panel_ui::width, onx_panel_ui::height - 44, ${strip_spacing},
                                        onx_geom::S(22));
          onx_assist::resize(onx_panel_ui::width, onx_panel_ui::height);
          onx_panel_ui::on_track = [](bool previous) {
            if (id(touch_input)->suppress_click()) return;
            id(ui_presenter)->notify_user_activity();
            id(emit_normal_media_track).execute(id(normal_device_detail_index), previous);
          };
          // Play/pause is the shared press action on the media detail.
          onx_panel_ui::on_play_pause = []() {
            if (id(touch_input)->suppress_click()) return;
