          id(immichframe_image)->set_source_pixel_limit(${display_width} * ${display_height});
          id(immichframe_image)->set_allow_redirects(false);
          onx_panel_ui::create_slideshow(id(standby_page)->obj, id(fonts_MiSans_Bold_64)->get_lv_font(),
                                         id(fonts_MiSans_Medium_14)->get_lv_font(),
                                         id(fonts_MiSans_Medium_24)->get_lv_font());
          id(touch_input)->set_dock_tap([](int x) {
            if(onx_notification_ui::owns_screen() || id(normal_device_detail_active))return;
            onx_navigation::press_at(x);
            const int target=onx_navigation::dock_target_at(x);
            if(target==onx_navigation::DASHBOARD) { if(onx_navigation::shortcut_action)onx_navigation::shortcut_action(); return; }
            if(target<0)return;
            id(ui_presenter)->notify_user_activity();
            onx_navigation::dock_offset=0;
            id(normal_device_selected_index)=target;
            id(show_normal_device_entry_page).execute(0);
          });
          id(touch_input)->set_dock_scroll([](int steps) {
            if (!onx_navigation::visible || onx_notification_ui::owns_screen()) return;
            id(ui_presenter)->notify_user_activity();
            if (onx_navigation::scroll_dock(steps)) id(refresh_normal_device_page).execute();
          });
          id(touch_input)->set_passthrough_fn([](int x, int y) {
            onx_notification_ui::hide_toast_unless(x, y);
            return onx_panel_ui::hit(x, y) || onx_notification_ui::bell_hit(x, y) || onx_notification_ui::timer_chip_hit(x, y) || onx_notification_ui::toast_hit(x,y);
          });

