api:
  id: api_server
  homeassistant_states: true
  on_client_connected:
    then:
      # Authentication completes before HA sends its state-subscription request,
      # so this callback must not treat every API client as Home Assistant.
      - script.execute: refresh_normal_ha_connection_state
  on_client_disconnected:
    then:
      # The callback runs after the departing client has been removed. Recheck
      # the remaining state-subscribing clients instead of forcing offline.
      - script.execute: refresh_normal_ha_connection_state
  actions:
    - action: show_message
      description: Show a reminder with optional image; empty image_url is text only, timeout_seconds zero waits for dismissal.
      variables:
        title: string
        message: string
        image_url: string
        timeout_seconds:
          type: int
          description: Seconds to display the message; use 60 for one minute or zero until dismissed.
          example: "60"
      then:
        - lambda: |-
            // Messages go to the notification centre (the full-screen popup was removed).
            onx_notification::center.add(title,message,timeout_seconds,image_url,millis());
    - action: apply_preset
      description: Switch the panel's controls to a saved preset by name.
      variables:
        name: string
      then:
        - lambda: |-
            onx_presets::request(name);
            onx_assist::dismiss();
    - action: save_preset
      description: Save the panel's current controls as a preset, replacing a preset with the same name.
      variables:
        name: string
      then:
        - lambda: |-
            const auto error = onx_presets::save_current(name);
            if (!error.empty()) ESP_LOGW("onx_presets", "save_preset \"%s\": %s", name.c_str(), error.c_str());
    - action: delete_preset
      description: Delete a saved preset by name. The panel's current controls do not change.
      variables:
        name: string
      then:
        - lambda: |-
            const auto error = onx_presets::remove_preset(name);
            if (!error.empty()) ESP_LOGW("onx_presets", "delete_preset \"%s\": %s", name.c_str(), error.c_str());
    - action: dismiss_message
      description: Dismiss the current or pending display reminder.
      then:
        - lambda: |-
            onx_notification::center.dismiss_latest();
    - action: show_control_feedback
      description: Show a brief, non-blocking value popup for a configured control entity.
      variables:
        entity_id: string
        value: string
        unit: string
      then:
        - lambda: |-
            for(int slot=0;slot<(int)custom_logic::CONFIGURABLE_DEVICE_SLOT_COUNT;++slot)
              if(entity_id==std::string(onx_gesture::configs[slot].entity) &&
                  custom_logic::cached_device_entity_id(slot)==onx_gesture::configs[slot].entity)
                onx_gesture::feedback(slot,value,unit,millis(),true);
            id(refresh_normal_gesture_feedback).execute();
