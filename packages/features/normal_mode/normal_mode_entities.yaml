  - platform: online_image
    id: media_cover_image
    url: http://homeassistant.local:8123/
    format: AUTO
    type: RGB565
    resize: ${ (240 * (ui_scale | float)) | round | int }x${ (240 * (ui_scale | float)) | round | int }
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            const bool streaming = id(media_cover_image)->is_streaming();
            const bool same_stream = streaming && onx_media::ready_url == onx_media::requested_url;
            onx_media::ready_url = onx_media::requested_url;
            onx_media::artwork_retry.on_success(onx_media::requested_url);
            onx_media::artwork_wait_reason.clear();
            onx_media::stat_end(true, millis());
            { const auto &f = id(media_cover_image)->last_stats(); auto &d = onx_media::last_fetch;
              d.attempts=f.attempts; d.open_ms=f.open_ms; d.read_ms=f.read_ms; d.bytes=f.bytes; d.heap_free_start=f.heap_free_start;
              d.heap_largest_start=f.heap_largest_start; d.heap_free_after_open=f.heap_free_after_open; d.https=f.https; d.stack_psram=f.stack_psram; d.cached=f.cached; d.host=f.host; }
            if (streaming) {
              onx_media::requested_ms = millis();
              onx_media::last_artwork_end_ms = millis();
              if (same_stream) {
                lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
                if (onx_panel_detail::main_artwork != nullptr) lv_obj_invalidate(onx_panel_detail::main_artwork);
              } else {
                onx_media::artwork_refresh_pending = true;
              }
              return;
            }
            onx_media::downloading = false;
            id(entity_icon_downloader)->set_artwork_busy(false);
            onx_media::last_artwork_end_ms = millis();
            onx_media::artwork_refresh_pending = true;
            // A camera's next frame replaced the pixels under the shown image.
            lv_image_cache_drop(id(media_cover_image)->get_lv_image_dsc());
            if (onx_panel_detail::main_artwork != nullptr) lv_obj_invalidate(onx_panel_detail::main_artwork);
            onx_runtime::record("artwork_ready");
            // OnlineImage still owns its connection until this callback returns.
            // Refresh only on the next interval, after its cleanup has finished.
    on_error:
      then:
        - lambda: |-
            onx_media::downloading = false;
            id(entity_icon_downloader)->set_artwork_busy(false);
            const uint32_t now = millis();
            if (onx_media::requested_url.find("/api/camera_proxy_stream/") != std::string::npos) {
              onx_media::stream_failed_url = onx_media::requested_url;
              onx_media::stream_failed_ms = now ? now : 1;
            }
            // A failed camera refresh keeps showing the last frame.
            if (!onx_media::same_camera(onx_media::ready_url, onx_media::requested_url)) onx_media::ready_url.clear();
            onx_media::last_artwork_end_ms = now;
            onx_media::stat_end(false, now);
            { const auto &f = id(media_cover_image)->last_stats(); auto &d = onx_media::last_fetch;
              d.attempts=f.attempts; d.open_ms=f.open_ms; d.read_ms=f.read_ms; d.bytes=f.bytes; d.heap_free_start=f.heap_free_start;
              d.heap_largest_start=f.heap_largest_start; d.heap_free_after_open=f.heap_free_after_open; d.https=f.https; d.stack_psram=f.stack_psram; d.cached=f.cached; d.host=f.host; }
            onx_media::stat_last_failure = id(media_cover_image)->last_error();
            onx_media::artwork_retry.on_failure(onx_media::requested_url, now);
            onx_media::artwork_wait_reason = "retry_wait";
            onx_media::retry_at_ms = onx_media::artwork_retry.wakeup_ms(onx_media::requested_url, now);
            // Home Assistant's cover failed: use the direct picture for a while.
            if (onx_companion::owns(onx_media::requested_url)) { onx_companion::fail(); onx_media::retry_at_ms = (now + 100) | 1; }
            onx_media::artwork_refresh_pending = true;
            onx_runtime::record("artwork_error");
