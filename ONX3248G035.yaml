# Room Companion for the ONX3248G035: shared application on a
# rectangular touch panel, with Assist and an optional dashboard stream.
substitutions:
  # Root values override the shared defaults during package merging.
  ui_scale: 1.3333
  font_scale: 1.3333
  # Keep room for future updates alongside the scaled panel fonts.
  font_bpp: 4
  project_name: onx3248g035
  project_friendly_name: ONX3248G035
  # Leave empty to provision Wi-Fi with Improv (USB or Bluetooth) or the setup AP.
  wifi_ssid: ""
  wifi_password: ""
  ap_password: ""
  logger_level: INFO
  uart_baud: "115200"
  # Idle screen after this many seconds without a touch (default; editable).
  standby_timeout_seconds: "30"
  diagnostics_update_interval: 15s
  display_update_interval: 16ms
  lcd_spi_data_rate: 40MHz
  lcd_backlight_default: 100%
  product_firmware_version: "2026.11.1.40"
  product_firmware_manifest_url: "https://raw.githubusercontent.com/fixtse/esp-ota/main/ota/releases/onx3248g035${firmware_variant}_manifest.yml"
  # Optional first-boot defaults for the dashboard stream (editable on Visit).
  default_dashboard_server: ""
  default_dashboard_url: ""

packages:
  board: !include packages/room_companion/boards/onx3248g035.yaml
  application: !include packages/room_companion/application.yaml
