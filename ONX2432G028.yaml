# Room Companion for the ONX2432G028: shared application on a
# rectangular touch panel, with Assist and an optional dashboard stream.
substitutions:
  # Root values override the shared defaults during package merging (a board
  # profile value would lose to packages/base/fonts.yaml): media and stepper
  # symbols in proportion with the 3/4-size layout.
  symbol_font: montserrat_20
  project_name: onx2432g028
  project_friendly_name: ONX2432G028
  # Leave empty to provision Wi-Fi with Improv (USB or Bluetooth) or the setup AP.
  wifi_ssid: ""
  wifi_password: ""
  ap_password: ""
  logger_level: INFO
  uart_baud: "115200"
  # Idle screen after this many seconds without a touch (default; editable).
  standby_timeout_seconds: "30"
  diagnostics_update_interval: 15s
  display_update_interval: 16ms
  lcd_spi_data_rate: 40MHz
  lcd_backlight_default: 100%
  product_firmware_version: "2026.11.1.39"
  product_firmware_manifest_url: "https://raw.githubusercontent.com/fixtse/esp-ota/main/ota/releases/onx2432g028${firmware_variant}_manifest.yml"
  # Optional first-boot defaults for the dashboard stream (editable on Visit).
  default_dashboard_server: ""
  default_dashboard_url: ""
  default_dashboard_scale: "0.75"

packages:
  board: !include packages/room_companion/boards/onx2432g028.yaml
  application: !include packages/room_companion/application.yaml
